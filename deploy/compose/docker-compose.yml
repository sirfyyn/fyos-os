# Hand-written template, built like the installer's setup (fyos-install). The agent is the runner
# (fyos-agent/runner); its configuration is in agent-runner.json.
# FYOS on a single machine: docker compose --env-file .env up -d
# Then open http://localhost:8080. Values in .env (template: env.example).
services:
  web:
    image: ${FYOS_BILD_WEB:?FYOS_BILD_WEB in .env setzen (Vorlage env.example)}
    ports:
      - "${FYOS_PORT:-8080}:8080"
    environment:
      FYOS_HUB_UPSTREAM: http://hub:8080
      FYOS_AGENT_UPSTREAM: http://agent:18438
      # The interface authenticates with the runner (nginx sets the header for /api/agent/)
      FYOS_AGENT_TOKEN: ${FYOS_AGENT_TOKEN}
    depends_on: [hub, agent]
    restart: unless-stopped

  hub:
    image: ${FYOS_BILD_HUB:?FYOS_BILD_HUB in .env setzen (Vorlage env.example)}
    environment:
      MCP_HUB_CONFIG_PATH: /etc/fyos-hub/config.yaml
      REDIS_URL: redis://redis:6379/0
      FYOS_OEFFENTLICH_URL: ${FYOS_OEFFENTLICH_URL:-http://localhost:8080}
      # The Hub's time zone: daily counters and time windows of schedules (docs/EXTENDING.md §2.12), e.g. Europe/Berlin
      TZ: ${TZ:-UTC}
      # File store (plugin dateien, app "Files"): folder in the volume, limit per file in MB (docs/EXTENDING.md §2.17)
      FYOS_DATEIEN: /data/dateien
      FYOS_DATEIEN_MAX_MB: ${FYOS_DATEIEN_MAX_MB:-25}
    volumes:
      - ./hub-config.yaml:/etc/fyos-hub/config.yaml:ro
      - dateien:/data/dateien
    depends_on: [redis]
    restart: unless-stopped

  agent:
    # The agent: long-running runner on pi-durable (fyos-agent/runner). State in the volume, model from .env.
    image: ${FYOS_BILD_AGENT:?FYOS_BILD_AGENT in .env setzen (Vorlage env.example)}
    environment:
      FYOS_RUNNER_TOKEN: ${FYOS_AGENT_TOKEN}
      FYOS_HUB_URL: http://hub:8080
      FYOS_MODELL_BASIS_URL: ${FYOS_MODELL_BASIS_URL}
      FYOS_MODELL_NAME: ${FYOS_MODELL_NAME}
      FYOS_MODELL_SCHLUESSEL: ${FYOS_MODELL_SCHLUESSEL}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./agent-runner.json:/etc/fyos/agent-runner.json:ro
      - agent-zustand:/home/node/.fyos
    depends_on: [hub]
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["--save", "", "--appendonly", "no"]
    restart: unless-stopped

volumes:
  agent-zustand:
  # The file store. Back it up like any volume; instead of the volume you can mount a folder of the host
  # (`/path/to/store:/data/dateien`, it must belong to the user with uid 1000).
  dateien:
