# Installed plugin packages load without an entry (entry point group mcp_hub.plugins).
# Entries only for configuration, secrets or enabled: false (schema: hub/config.example.yaml).
host: 0.0.0.0
port: 8080
path: /mcp
plugins:
  - name: echo
    enabled: false
  - name: math
    enabled: false
  - name: skills
    config:
      quellen:
        - /opt/fyos/skills
  - name: beispiel_app
