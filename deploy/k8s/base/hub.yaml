apiVersion: v1
kind: ConfigMap
metadata:
  name: fyos-umgebung
data:
  oeffentlich_url: http://localhost:8080
  erlaubte_hosts: localhost
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: fyos-hub-config
data:
  config.yaml: |
    # Installed plugin packages load without an entry (entry point group mcp_hub.plugins).
    host: 0.0.0.0
    port: 8080
    path: /mcp
    plugins:
      - { name: echo, enabled: false }
      - { name: math, enabled: false }
      - name: skills
        config:
          quellen: [/opt/fyos/skills]
      - name: beispiel_app
---
# The file store (plugin dateien, app "Files"): files, earlier versions and the trash live here.
# Adjust size and storage class in the overlay. Back it up like any volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fyos-dateien
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hub
spec:
  replicas: 1
  # Exactly one Hub at a time: the file store's volume is ReadWriteOnce, and versions and trash are not built for
  # two Hubs writing the same files. Hence Recreate instead of Rolling.
  # `rollingUpdate: null` is needed: on an existing deployment the server fills in the rolling values, and Kubernetes
  # rejects them with Recreate ("may not be specified when strategy type is Recreate") as soon as Flux changes the strategy.
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels: { app: hub }
  template:
    metadata:
      labels: { app: hub }
      # /metrics: core counters, plugin metrics and schedule (Prometheus text)
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: /metrics
    spec:
      securityContext:
        fsGroup: 1000
      containers:
        - name: hub
          image: fyos-os/hub
          ports:
            - containerPort: 8080
          env:
            - { name: MCP_HUB_CONFIG_PATH, value: /etc/fyos-hub/config.yaml }
            # File store (docs/EXTENDING.md §2.17); FYOS_DATEIEN_MAX_MB raises the limit per file (default 25)
            - { name: FYOS_DATEIEN, value: /data/dateien }
            - { name: REDIS_URL, value: "redis://redis:6379/0" }
            - name: FYOS_OEFFENTLICH_URL
              valueFrom:
                configMapKeyRef: { name: fyos-umgebung, key: oeffentlich_url, optional: true }
            - name: FYOS_ERLAUBTE_HOSTS
              valueFrom:
                configMapKeyRef: { name: fyos-umgebung, key: erlaubte_hosts, optional: true }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 768Mi }
          volumeMounts:
            - { name: config, mountPath: /etc/fyos-hub }
            - { name: dateien, mountPath: /data/dateien }
      volumes:
        - name: config
          configMap: { name: fyos-hub-config }
        - name: dateien
          persistentVolumeClaim: { claimName: fyos-dateien }
---
apiVersion: v1
kind: Service
metadata:
  name: hub
spec:
  selector: { app: hub }
  ports:
    - port: 8080
      targetPort: 8080
