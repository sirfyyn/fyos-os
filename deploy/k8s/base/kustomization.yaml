# FYOS base installation for Kubernetes. An overlay sets namespace, images and the
# agent configuration (ConfigMap `fyos-agent-config`). The defaults below point to an
# example address that can never be resolved: without an overlay, pulling fails visibly.
#
# Images in the overlay: kustomize replaces here first, the overlay afterwards. An overlay therefore
# names the images the way this base outputs them, i.e. with the full example name:
#   images:
#     - name: registry.example.com/fyos/fyos-os/web
#       newName: registry.meine.example/fyos-os/web
# A short name (fyos-os/web) no longer takes effect in the overlay. Flux (`spec.images` of the
# Kustomization), by contrast, replaces the entries below of the same name and accepts both forms.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
labels:
  - pairs:
      app.kubernetes.io/part-of: fyos
resources:
  - redis.yaml
  - hub.yaml
  - agent.yaml
  - web.yaml
images:
  - name: fyos-os/web
    newName: registry.example.com/fyos/fyos-os/web
    newTag: main
  - name: fyos-os/hub
    newName: registry.example.com/fyos/fyos-os/hub
    newTag: main
  - name: fyos-agent/runner
    newName: registry.example.com/fyos/fyos-agent/runner
    newTag: main
