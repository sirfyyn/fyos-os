apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 1
  selector:
    matchLabels: { app: web }
  template:
    metadata:
      labels: { app: web }
    spec:
      containers:
        - name: web
          image: fyos-os/web
          ports:
            - containerPort: 8080
          env:
            - { name: FYOS_HUB_UPSTREAM, value: "http://hub:8080" }
            # The runner under /api/agent/; nginx authenticates the interface with this token (web/README.md)
            - { name: FYOS_AGENT_UPSTREAM, value: "http://agent:18438" }
            - name: FYOS_AGENT_TOKEN
              valueFrom:
                secretKeyRef: { name: fyos-agent-token, key: token }
          readinessProbe:
            httpGet: { path: /, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: { app: web }
  ports:
    - port: 80
      targetPort: 8080
