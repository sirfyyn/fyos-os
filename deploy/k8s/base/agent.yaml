# Der Agent: dauerhafter Runner auf pi-durable (fyos-agent/runner). Die Konfiguration steht in der ConfigMap
# `fyos-agent-config` (agent-runner.json, Schema: fyos-agent/runner/beispiele/agent-runner.beispiel.json; das Overlay des
# Installers ersetzt sie). Modellzugang und Token kommen aus Secrets, die das Overlay anlegt: `fyos-modell` (basis_url,
# name, schluessel) und `fyos-agent-token` (token, dasselbe Token bekommt die Oberfläche für /api/agent/).
# Matrix als Meldeweg kann der Runner nur über seine eigene Konfiguration (pi_durable.freigabe_meldung.kanaele).
apiVersion: v1
kind: ConfigMap
metadata:
  name: fyos-agent-config
data:
  agent-runner.json: |
    {
      "hub": "http://hub:8080",
      "agent": "main",
      "takt": {"an": false},
      "pi_durable": {
        "port": 18438,
        "device": {"id": "server", "name": "Fy", "kind": "linux"},
        "storage": "~/.fyos/fyos.sqlite",
        "security": {"allowedOrigins": ["http://localhost:8080"]},
        "browser": {"enabled": false},
        "desktop": {"enabled": false}
      }
    }
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-zustand
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: agent
spec:
  replicas: 1
  # Genau ein Runner: sein Zustand (SQLite im Volume, ReadWriteOnce) ist nicht für zwei Prozesse gebaut.
  # `rollingUpdate: null` aus demselben Grund wie beim Hub (hub.yaml).
  strategy:
    type: Recreate
    rollingUpdate: null
  selector:
    matchLabels: { app: agent }
  template:
    metadata:
      labels: { app: agent }
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: agent
          image: fyos-agent/runner
          ports:
            - containerPort: 18438
          env:
            - { name: FYOS_HUB_URL, value: "http://hub:8080" }
            - name: FYOS_RUNNER_TOKEN
              valueFrom:
                secretKeyRef: { name: fyos-agent-token, key: token }
            - name: FYOS_MODELL_BASIS_URL
              valueFrom:
                secretKeyRef: { name: fyos-modell, key: basis_url, optional: true }
            - name: FYOS_MODELL_NAME
              valueFrom:
                secretKeyRef: { name: fyos-modell, key: name, optional: true }
            - name: FYOS_MODELL_SCHLUESSEL
              valueFrom:
                secretKeyRef: { name: fyos-modell, key: schluessel, optional: true }
          readinessProbe:
            tcpSocket: { port: 18438 }
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { memory: 2Gi }
          volumeMounts:
            - { name: zustand, mountPath: /home/node/.fyos }
            - { name: config, mountPath: /etc/fyos, readOnly: true }
      volumes:
        - name: zustand
          persistentVolumeClaim: { claimName: agent-zustand }
        - name: config
          configMap: { name: fyos-agent-config }
---
apiVersion: v1
kind: Service
metadata:
  name: agent
spec:
  selector: { app: agent }
  ports:
    - port: 18438
      targetPort: 18438
