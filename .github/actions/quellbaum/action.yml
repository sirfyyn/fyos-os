# Source tree of fyos-os for other repos: returns the path of the root, so that for example fyos-plugin-vorlage can
# install the Hub (hub/) and the installer (installer/) from source.
# With `uses:` the CI runner downloads this repo completely anyway; the action needs neither a secret nor a checkout
# of its own. As long as fyos-os is private, the setting Actions > General > Access ("Accessible from repositories
# owned by the user") gives the other repos of the same account access; a public repo does not need it.
# Call:  uses: <owner>/fyos-os/.github/actions/quellbaum@main
name: Quellbaum von fyos-os
description: Returns the path of the root of the fyos-os source tree (hub/, installer/)

outputs:
  wurzel:
    description: Absolute path of the fyos-os root on the CI runner
    value: ${{ steps.pfad.outputs.wurzel }}

runs:
  using: composite
  steps:
    - id: pfad
      shell: bash
      run: echo "wurzel=$(cd "$GITHUB_ACTION_PATH/../../.." && pwd)" >> "$GITHUB_OUTPUT"
