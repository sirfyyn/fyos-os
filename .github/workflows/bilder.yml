# Bilder bauen und nach ghcr.io schieben: nur auf einen Tag v* oder von Hand (Actions, bilder, "Run workflow"),
# nicht bei jedem Push. Es sind dieselben Bilder wie in der Gitea-CI (.gitea/workflows/ci.yml, Job bauen):
#   ghcr.io/<besitzer>/fyos-os/web   aus web/Dockerfile
#   ghcr.io/<besitzer>/fyos-os/hub   aus hub/Dockerfile
# Die Namen folgen dem Muster <registry>/fyos-os/<teil>, das der Installer erwartet: FYOS_REGISTRY=ghcr.io/<besitzer>.
# Tags: der Name des Tags (v0.1.0) oder des Zweigs (main) und die Commit-SHA; auf einen Tag ohne Bindestrich zusätzlich latest.
# Angemeldet wird mit dem Laufzeit-Token (packages: write), eigene Geheimnisse gibt es nicht. Nur linux/amd64, wie in der Gitea-CI.
name: bilder

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bilder-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  bauen:
    name: Bild ${{ matrix.teil }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - teil: web
            titel: FYOS-Web
            beschreibung: Desktop shell of FYOS in the browser (Astro and SolidJS) served by nginx
          - teil: hub
            titel: FYOS-Hub
            beschreibung: MCP hub of FYOS - For Your Own Sake. Plugins and apps with a user interface
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Bildname festlegen (ghcr.io verlangt Kleinbuchstaben)
        env:
          TEIL: ${{ matrix.teil }}
        run: echo "BILD=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fyos-os/${TEIL}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.teil }}
          file: ${{ matrix.teil }}/Dockerfile
          push: true
          tags: |
            ${{ env.BILD }}:${{ github.ref_name }}
            ${{ env.BILD }}:${{ github.sha }}
            ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') && format('{0}:latest', env.BILD) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=${{ matrix.titel }}
            org.opencontainers.image.description=${{ matrix.beschreibung }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
