# Build images and push them to ghcr.io: only on a tag v* or by hand (Actions, bilder, "Run workflow"),
# not on every push. These are the same images as in the Gitea CI (.gitea/workflows/ci.yml, job bauen):
#   ghcr.io/<owner>/fyos-os/web   from web/Dockerfile
#   ghcr.io/<owner>/fyos-os/hub   from hub/Dockerfile
# The names follow the pattern <registry>/fyos-os/<part> that the installer expects: FYOS_REGISTRY=ghcr.io/<owner>.
# Tags: the name of the tag (v0.1.0) or the branch (main) and the commit SHA; on a tag without a hyphen also latest.
# Login uses the runtime token (packages: write); there are no secrets of its own. Only linux/amd64, as in the Gitea CI.
name: bilder

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bilder-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  bauen:
    name: Bild ${{ matrix.teil }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - teil: web
            titel: FYOS-Web
            beschreibung: Desktop shell of FYOS in the browser (Astro and SolidJS) served by nginx
          - teil: hub
            titel: FYOS-Hub
            beschreibung: MCP hub of FYOS - For Your Own Sake. Plugins and apps with a user interface
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set the image name (ghcr.io requires lower case)
        env:
          TEIL: ${{ matrix.teil }}
        run: echo "BILD=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/fyos-os/${TEIL}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.teil }}
          file: ${{ matrix.teil }}/Dockerfile
          push: true
          tags: |
            ${{ env.BILD }}:${{ github.ref_name }}
            ${{ env.BILD }}:${{ github.sha }}
            ${{ github.ref_type == 'tag' && !contains(github.ref_name, '-') && format('{0}:latest', env.BILD) || '' }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
            org.opencontainers.image.title=${{ matrix.titel }}
            org.opencontainers.image.description=${{ matrix.beschreibung }}
            org.opencontainers.image.version=${{ github.ref_name }}
            org.opencontainers.image.revision=${{ github.sha }}
