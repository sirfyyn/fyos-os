# Publish packages on PyPI: fyos-hub (hub/) and fyos-installer (installer/).
# Trigger: a tag v* or by hand (Actions, pypi, "Run workflow"). It publishes only when the run is on a tag;
# from a branch it only builds and checks.
# Publishing uses no token but Trusted Publishing (OIDC). On pypi.org every package needs a publisher that points to
# this repo (owner and name), the workflow pypi.yml and the environment pypi (for a new project as a "pending
# publisher"). The environment pypi lives in this repo (Settings, Environments). The tag carries the version: v0.1.0 for 0.1.0.
name: pypi

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pypi-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Pakete bauen und prüfen
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      # setuptools 77 and newer takes LICENSE* and NOTICE* from the package's folder into the wheel (dist-info/licenses) and sdist.
      # The files live in the repo root, so they are copied into the package folders before the build.
      - name: Copy LICENSE and NOTICE into the package folders
        run: |
          cp LICENSE NOTICE hub/
          cp LICENSE NOTICE installer/
      - name: Build packages
        run: |
          python -m pip install -q build==1.6.1
          python -m build --outdir dist/hub hub
          python -m build --outdir dist/installer installer
      - name: Check that wheel and sdist contain LICENSE and NOTICE and the version matches the tag
        run: |
          python - dist <<'PY'
          import os
          import sys
          import tarfile
          import zipfile
          from pathlib import Path

          PFLICHT = ("LICENSE", "NOTICE")
          tag = os.environ["GITHUB_REF_NAME"].removeprefix("v") if os.environ.get("GITHUB_REF_TYPE") == "tag" else None
          wheels = sorted(Path(sys.argv[1]).rglob("*.whl"))
          sdists = sorted(Path(sys.argv[1]).rglob("*.tar.gz"))
          fehler = []
          if not wheels or len(wheels) != len(sdists):
              fehler.append(f"erwartet je Paket ein Wheel und ein Sdist, gefunden {len(wheels)} und {len(sdists)}")
          for wheel in wheels:
              namen = zipfile.ZipFile(wheel).namelist()
              fehler += [f"{wheel.name}: {d} fehlt" for d in PFLICHT if not any(n.endswith(f".dist-info/licenses/{d}") for n in namen)]
              if tag and wheel.name.split("-")[1] != tag:
                  fehler.append(f"{wheel.name}: Version passt nicht zum Tag v{tag}")
          for sdist in sdists:
              namen = tarfile.open(sdist).getnames()
              fehler += [f"{sdist.name}: {d} fehlt" for d in PFLICHT if not any(n.count("/") == 1 and n.endswith(f"/{d}") for n in namen)]
          for f in fehler:
              print(f"::error::{f}")
          if fehler:
              sys.exit(1)
          print(f"{len(wheels)} Wheel(s) und {len(sdists)} Sdist(s): LICENSE und NOTICE sind enthalten")
          PY
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-hub
          path: dist/hub
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist-installer
          path: dist/installer
          if-no-files-found: error

  publish:
    name: Auf PyPI veröffentlichen (${{ matrix.projekt }})
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/project/${{ matrix.projekt }}/
    permissions:
      id-token: write # Trusted Publishing: PyPI exchanges the token for this run's identity
    strategy:
      fail-fast: false
      matrix:
        include:
          - paket: hub
            projekt: fyos-hub
          - paket: installer
            projekt: fyos-installer
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist-${{ matrix.paket }}
          path: dist
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist
