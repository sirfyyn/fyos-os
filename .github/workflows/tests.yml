# Check on every push and every pull request: the same tests as the Gitea CI (.gitea/workflows/ci.yml), but without
# image build and without package upload. bilder.yml builds the images, pypi.yml publishes the packages, both only on a tag v*.
# No secrets needed; the runtime token may only read. The actions are pinned to a commit; the version is in the
# comment after it.
name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  pruefen:
    name: Hub, Werkzeuge, Installer
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Hub tests
        run: |
          python -m pip install -q -e "hub[test]"
          python -m pytest hub/tests -q
      - name: Tool tests
        run: python -m pytest tools -q
      - name: Installer tests
        run: |
          python -m pip install -q -e "installer[test]"
          python -m pytest installer/tests -q

  web:
    name: Shell-Tests und Bau
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
        working-directory: web
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
      - name: Dependencies
        run: npm ci --no-audit --no-fund
      - name: Shell tests
        run: npx vitest run
      - name: Build
        run: npx astro build

  geheimnisse:
    name: Geheimnisse und Sauberkeit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # gitleaks as the official release binary at a fixed version. The checksum is the line linux_x64 from
      # gitleaks_8.30.1_checksums.txt of the same release; if it does not match, the run fails.
      GITLEAKS_VERSION: "8.30.1"
      GITLEAKS_SHA256: "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the second gitleaks run
          persist-credentials: false
      - name: Cleanliness (no private addresses, accounts, secrets)
        run: python3 tools/sauber.py .
      - name: Download and verify gitleaks
        run: |
          archiv="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 --output "$RUNNER_TEMP/$archiv" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archiv"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archiv" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/gitleaks"
          tar -xzf "$RUNNER_TEMP/$archiv" -C "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"
      - name: gitleaks over the whole tree
        run: gitleaks dir . --no-banner --redact --verbose
      - name: gitleaks over the history
        run: gitleaks git . --no-banner --redact --verbose
