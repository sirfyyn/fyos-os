<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Werkstatt</title>
<style>/*STIL*/
  /* ── Aufbau: links die Liste, rechts das Skript; schmal zeigt nur eines von beiden ── */
  .werk { display: grid; grid-template-columns: minmax(250px, 320px) minmax(0, 1fr); gap: 22px; align-items: start; }
  #links, #rechts { min-width: 0; }
  body.nur-ergebnis .werk { grid-template-columns: minmax(0, 1fr); }
  body.nur-ergebnis #links { display: none; }
  .zurueck { margin: -4px 0 12px -8px; }
  @media (min-width: 720px) { .zurueck { display: none; } }
  @media (max-width: 719px) {
    .werk { grid-template-columns: minmax(0, 1fr); }
    body.mit-skript #links, body:not(.mit-skript) #rechts { display: none; }
  }

  /* ── Liste ── */
  .werkzeugleiste { display: grid; gap: 10px; margin-bottom: 16px; }
  .werkzeugleiste input[type="search"] { width: 100%; }
  /* Die Lupe liegt als eigenes Symbol im Feld: das Hintergrundbild der Vorlage fällt im Fokus weg. */
  .suchfeld { position: relative; }
  .suchfeld > .ico { position: absolute; left: 13px; top: 50%; width: 15px; height: 15px; margin-top: -7.5px; color: var(--leise); pointer-events: none; }
  .suchfeld > input[type="search"] { background-image: none; }
  .filter { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  .filter .chip { padding: 0 12px; }
  .filter .ortfeld { flex: 1 1 130px; max-width: 100%; }
  .filter .ortwahl { width: 100%; min-height: 32px; padding-left: 12px; border-radius: var(--r-voll); font-size: 13px; }
  @media (pointer: coarse) { .filter .ortwahl { min-height: 38px; } }
  /* Auswahlfeld: der Pfeil liegt als eigenes Symbol im Feld, weil das Hintergrundbild der Vorlage im Fokus wegfällt. */
  .auswahlfeld { position: relative; }
  .auswahlfeld > select { background-image: none; }
  .fe .auswahlfeld { margin-top: 4px; }
  .fe .auswahlfeld > .fe-feld { margin-top: 0; }
  .auswahlfeld > .ico { position: absolute; right: 12px; top: 50%; width: 14px; height: 14px; margin-top: -7px; color: var(--leise); pointer-events: none; }
  .liste-gruppe { max-height: 600px; overflow: auto; }
  .klemme { display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow: hidden; }
  @media (max-width: 480px) { .liste-gruppe { max-height: none; } }
  /* In FYOS wächst das Fenster mit, nur die Fläche scrollt (_stil.css Abschnitt 13) */
  html[data-host="fyos"][data-rahmen="frei"] .liste-gruppe { max-height: none; }

  /* ── Skriptkarte ── */
  .skriptkarte { padding: 20px 20px 18px; }
  .skript-kopf { display: flex; gap: 14px; align-items: flex-start; }
  .skript-text { min-width: 0; flex: 1 1 auto; }
  .skript-titel { display: block; margin: 0; padding: 0; font-size: 20px; line-height: 1.25; font-weight: var(--font-weight-semibold); letter-spacing: -0.015em; color: var(--fg); }
  .skript-zweck { margin: 4px 0 0; font-size: 14px; color: var(--mut); }
  .marken { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
  .skriptkarte > .hinweis { margin-top: 14px; }
  h3.klein { display: flex; align-items: center; gap: 7px; min-height: 0; padding: 0; font-weight: var(--font-weight-semibold); }
  h3.klein .ico { color: var(--leise); }
  #form { margin-top: 22px; }
  .keine-angaben { display: flex; align-items: center; gap: 8px; margin: 0; font-size: 13.5px; color: var(--mut); }
  .keine-angaben .ico { color: var(--gut); }
  .technik { margin-top: 18px; }
  .technik dl.kv { margin: 8px 0 0; }
  .technik .marken { margin-top: 0; }
  .karte > .laedt { padding: 18px 4px; }

  /* ── Formular: Beschriftung, Hilfe als zweite Zeile, dann das Feld ── */
  .formular { display: grid; gap: 18px; }
  .fe { display: grid; gap: 4px; min-width: 0; }
  .fe-kopf { display: flex; align-items: center; flex-wrap: wrap; gap: 3px 10px; }
  .fe-name { font-size: 13.5px; font-weight: var(--font-weight-semibold); color: var(--fg); }
  .pflicht { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: var(--font-weight-medium); color: var(--mut); }
  .pflicht::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--warn); }
  .fe-hilfe { margin: 0; font-size: 12.5px; line-height: 1.45; color: var(--mut); overflow-wrap: anywhere; }
  .fe-feld { margin-top: 4px; }
  .zeile.fe { display: flex; gap: 12px; } /* Schalterzeile: Text links, Schalter rechts */
  .fe :where(input:not([type="checkbox"]), select, textarea) { width: 100%; }
  .fe-fehler { margin: 2px 0 0; font-size: 12.5px; color: var(--schlecht); }
  .fe.fehlt :where(input, select, textarea) { border-color: color-mix(in oklab, var(--schlecht) 70%, transparent); }
  .fe.fehlt .reiter { border-color: color-mix(in oklab, var(--schlecht) 70%, transparent); }
  .fe .segment { display: flex; width: 100%; }
  .fe .segment button { flex: 1 1 auto; min-width: 0; min-height: 32px; padding: 0 10px; white-space: nowrap; }
  .formular .gruppe .zeile { min-height: 56px; }
  .formular .gruppe label.zeile-text { cursor: pointer; }
  .weitere { margin: 0; }
  .weitere > summary { margin-bottom: 4px; }
  .weitere[open] > summary { margin-bottom: 14px; }
  .weitere .formular { margin-bottom: 4px; }

  /* ── Aktionen: Lesen einfach, Schreiben in zwei Schritten ── */
  .aktion { margin-top: 22px; }
  .aktion .knoepfe { gap: 10px; }
  .gross-knopf { min-height: 42px; padding: 0 22px; font-size: 14.5px; }
  .zusage { display: flex; align-items: center; gap: 7px; margin: 12px 0 0; font-size: 12.5px; color: var(--mut); }
  .zusage .ico { color: var(--gut); font-size: 15px; }
  .sicher { display: grid; gap: 16px; padding: 16px; border: 1px solid color-mix(in oklab, var(--warn) 28%, var(--line-2)); border-radius: var(--r-m); background: linear-gradient(120deg, color-mix(in oklab, var(--warn) 11%, transparent), transparent 72%); }
  .sicher.schlecht { border-color: color-mix(in oklab, var(--schlecht) 30%, var(--line-2)); background: linear-gradient(120deg, color-mix(in oklab, var(--schlecht) 11%, transparent), transparent 72%); }
  .sicher-kopf { display: flex; align-items: flex-start; gap: 12px; }
  .sicher-kopf b { display: block; font-size: 14.5px; line-height: 1.35; }
  .sicher-kopf p { margin: 2px 0 0; font-size: 13px; color: var(--mut); }
  .schritte { display: grid; gap: 14px; margin: 0; padding: 0; list-style: none; }
  .schritt { display: flex; align-items: center; flex-wrap: wrap; gap: 10px 12px; }
  .nr { display: inline-grid; flex: none; place-items: center; width: 24px; height: 24px; border-radius: 50%; background: color-mix(in oklab, var(--fg) 11%, transparent); font-size: 12px; font-weight: var(--font-weight-semibold); color: var(--mut); transition: background-color var(--tempo), color var(--tempo); }
  .nr .ico { width: 14px; height: 14px; stroke-width: 2.6; }
  .schritt.fertig .nr { background: var(--gut); color: var(--deck); }
  .schritt-text { flex: 1 1 170px; min-width: 0; }
  .schritt-titel { font-size: 14px; font-weight: var(--font-weight-semibold); line-height: 1.35; }
  .schritt-unter { font-size: 12.5px; line-height: 1.45; color: var(--mut); }
  .schritt-unter.gut { color: var(--gut); }
  .schritt-unter.warn { color: var(--warn); }
  .schritt .wahl { min-height: 30px; margin-top: 2px; font-size: 13px; }
  .schritt .haupt:disabled { opacity: 0.55; }
  @media (max-width: 480px) { .schritt > button { flex: 1 1 100%; min-height: 44px; } }
  .pflichtmeldung { margin-top: 12px; }

  /* ── Ergebnis ── */
  #ergebnis { margin-top: 24px; }
  #ergebnis:empty { display: none; }
  body.nur-ergebnis #ergebnis { margin-top: 0; }
  .kopie { flex: none; }
  .satz .kopie { align-self: center; margin-left: auto; }
  @media (max-width: 480px) { .kopie.nur-sym { width: 34px; min-width: 34px; padding: 0; } .kopie.nur-sym .beschriftung { display: none; } }
  body.nur-ergebnis .zurueck { display: none; }
  .satz-text .marke { margin-left: 6px; }
  .lauf-info { padding: 16px 4px 8px; }
  .lauf-info .balken { margin-top: 4px; }
  .block { margin-top: 16px; }
  .block > h3.klein { margin: 0 0 8px; }
  .textblock-kopf { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 30px; }
  .textblock-titel { font-size: 13px; font-weight: var(--font-weight-semibold); color: var(--mut); }
  .textblock pre { margin: 4px 0 0; }
  .textblock .kopiert { color: var(--gut); }
  details.aufklapper { margin-top: 14px; }
  details.aufklapper > .textblock { margin-top: 6px; }
  .tabelle-kopf { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin: 0 0 8px; }
  .tabwrap { max-height: 520px; }
  .tabwrap table { min-width: 100%; }
  .tabwrap th button { min-height: 0; padding: 0; gap: 5px; border: 0; border-radius: 0; background: none; box-shadow: none; font: inherit; color: inherit; white-space: nowrap; }
  .tabwrap th button:hover:not(:disabled) { background: none; color: var(--fg); }
  .tabwrap th[aria-sort] { color: var(--fg); }
  .tabwrap th[aria-sort] button::after { content: ""; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; }
  .tabwrap th[aria-sort="ascending"] button::after { border-bottom: 5px solid currentColor; }
  .tabwrap th[aria-sort="descending"] button::after { border-top: 5px solid currentColor; }
  .tabwrap td code { font-size: 11.5px; }
  .tabwrap th, .tabwrap td { white-space: nowrap; }
  .tabwrap td.lang { min-width: 220px; max-width: 420px; white-space: normal; overflow-wrap: anywhere; }
  /* Passt die Tabelle nicht in ihren Platz (Handy, schmales Fenster, Chat), wird jede Zeile zur Karte; tabellenForm() entscheidet. */
  .tabwrap.karten { max-height: none; overflow: visible; border: 0; background: none; }
  .tabwrap.karten thead { display: none; }
  .tabwrap.karten table, .tabwrap.karten tbody, .tabwrap.karten tr, .tabwrap.karten td { display: block; }
  .tabwrap.karten tbody { display: grid; gap: 10px; }
  .tabwrap.karten tr { padding: 8px 14px; border: 1px solid var(--line-2); border-radius: var(--r-m); background: var(--flaeche); }
  .tabwrap.karten td { display: flex; justify-content: space-between; gap: 14px; min-width: 0; max-width: none; padding: 5px 0; border: 0; text-align: right; white-space: normal; overflow-wrap: anywhere; }
  .tabwrap.karten td::before { content: attr(data-l); flex: none; max-width: 46%; text-align: left; color: var(--mut); }
  .tabwrap.karten td:first-child { display: block; padding: 3px 0 7px; text-align: left; font-size: 14.5px; font-weight: var(--font-weight-semibold); color: var(--fg); }
  .tabwrap.karten td:first-child::before { content: none; }
  .tabwrap.karten tbody tr:hover > td { background: none; }
  .cron { font-family: var(--mono); font-size: 12.5px; white-space: nowrap; }
  .kennzahlen + * { margin-top: 14px; }
  .zeigen-kopf { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 18px; }
  .zeigen-kopf h2 { display: block; margin: 0; padding: 0; font-size: 20px; line-height: 1.25; font-weight: var(--font-weight-semibold); letter-spacing: -0.015em; color: var(--fg); }
  .zeigen-kopf p { margin: 4px 0 0; font-size: 14px; color: var(--mut); }
  .teil { margin-top: 20px; }
  .teil > h3.klein { margin: 0 0 8px; }
  .karte > dl.kv:first-child { margin-top: 0; }
  .karte > dl.kv:last-child { margin-bottom: 0; }
  .wert-nein { color: var(--mut); }

  /* ── Diagramm ── */
  .dg { margin: 0; }
  .dg-flaeche { position: relative; }
  .dg-flaeche svg { display: block; max-width: 100%; height: auto; overflow: visible; touch-action: pan-y; }
  .dg-flaeche svg:focus-visible { outline-offset: 4px; border-radius: 6px; }
  .dg .gitter { stroke: var(--line); stroke-width: 1; }
  .dg .grundlinie { stroke: var(--line-3); stroke-width: 1; }
  .dg .achse { fill: var(--leise); font: 11px var(--schrift); font-variant-numeric: tabular-nums; }
  .dg .endtext { fill: var(--mut); font: 12px var(--schrift); }
  .dg .linie { fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .dg .unterflaeche { fill: currentColor; stroke: none; opacity: 0.1; }
  .dg .markierung { fill: currentColor; stroke: var(--deck); stroke-width: 2; }
  .dg .faden { stroke: var(--line-3); stroke-width: 1; }
  .dg-tip { position: absolute; z-index: 3; top: 8px; min-width: 130px; max-width: 78%; padding: 8px 11px 9px; border: 1px solid var(--line-3); border-radius: var(--r-s); background: color-mix(in oklab, var(--deck) 94%, transparent); box-shadow: var(--shadow-md); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); font-size: 12.5px; pointer-events: none; }
  .dg-tip-kopf { margin-bottom: 4px; font-size: 11.5px; color: var(--mut); }
  .dg-tip-zeile { display: flex; align-items: center; gap: 8px; line-height: 1.55; }
  .dg-tip-zeile i, .legende i { flex: none; width: 14px; height: 3px; border-radius: 2px; background: var(--c); }
  .dg-tip-wert { font-weight: var(--font-weight-semibold); font-variant-numeric: tabular-nums; color: var(--fg); }
  .dg-tip-name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--mut); }
  .legende { display: flex; flex-wrap: wrap; gap: 4px 16px; margin-top: 12px; }
  .legende span { display: inline-flex; align-items: center; gap: 7px; max-width: 100%; font-size: 12.5px; color: var(--mut); }
  .legende b { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: var(--font-weight-normal); }
  .dg details { margin-top: 12px; }
  .dg details .tabwrap { margin-top: 6px; max-height: 320px; }
</style>
</head>
<body>
<!--KOPF-->
  <button id="neu" class="rund drehen" title="Aktualisieren" aria-label="Aktualisieren"><svg class="ico" data-symbol="refresh-cw"></svg></button>
<!--/KOPF-->
<main class="werk" id="werk">
  <section id="links" aria-label="Skripte">
    <div class="werkzeugleiste" data-klebt>
      <div class="suchfeld"><svg class="ico" data-symbol="search" aria-hidden="true"></svg><input id="q" type="search" placeholder="Skripte suchen" aria-label="Skripte suchen" autocomplete="off" enterkeyhint="search"></div>
      <div class="filter" id="filter" role="group" aria-label="Filter">
        <button type="button" class="chip an" aria-pressed="true" data-wirkung=""><svg class="ico" data-symbol="list"></svg>Alle</button>
        <button type="button" class="chip" aria-pressed="false" data-wirkung="lesen"><svg class="ico" data-symbol="eye"></svg>Lesend</button>
        <button type="button" class="chip" aria-pressed="false" data-wirkung="schreiben"><svg class="ico" data-symbol="pencil"></svg>Schreibend</button>
        <button type="button" class="chip" aria-pressed="false" data-wirkung="system"><svg class="ico" data-symbol="settings"></svg>System</button>
        <button type="button" class="chip" aria-pressed="false" data-wirkung="loeschen"><svg class="ico" data-symbol="trash-2"></svg>Löschend</button>
        <div class="auswahlfeld ortfeld" id="ort-feld" hidden><select id="ort" class="ortwahl" aria-label="Nach Ort filtern"><option value="">Jeder Ort</option></select><svg class="ico" data-symbol="chevron-down" aria-hidden="true"></svg></div>
      </div>
    </div>
    <div class="gruppe liste-gruppe"><ul id="liste" class="zeilen" aria-label="Skripte"><li class="laedt gross">Skripte werden geladen …</li></ul></div>
  </section>
  <section id="rechts" aria-label="Skript und Ergebnis">
    <button type="button" id="zurueck" class="leise klein zurueck"><svg class="ico" data-symbol="chevron-left"></svg>Alle Skripte</button>
    <div id="skript"></div>
    <div id="ergebnis"></div>
  </section>
</main>

<script>
/*BRUECKE*/
const $ = (id) => document.getElementById(id);
const { esc, symbol, kachel, marke, zustand, satz } = App;
const rufen = (name, args) => App.rufen("werkstatt__" + name, args);
const fehlertext = App.fehlertext;

// ── Wörter für Menschen ────────────────────────────────────────────────────────
// Kopfblöcke und Ausgaben tragen Bezeichner (praefix, alter_tage) und ae/oe/ue-Schreibweisen. Angezeigt wird Deutsch:
// bekannte Wörter bekommen ihre Umlaute zurück, Bezeichner werden zu Beschriftungen. Unbekanntes bleibt, wie es ist.
const UMLAUTE = new Map((
  "aendere=ändere aendern=ändern aendert=ändert aenderung=änderung aenderungen=änderungen agentenauftraege=agentenaufträge " +
  "bestaetige=bestätige bestaetigen=bestätigen bestaetigt=bestätigt bestaetigung=bestätigung faerbt=färbt fuer=für fuehrt=führt " +
  "gross=groß grosse=große groesse=größe hoechstens=höchstens laeuft=läuft laeufe=läufe loeschen=löschen loesche=lösche loescht=löscht " +
  "luecke=lücke pruefe=prüfe pruefen=prüfen prueft=prüft pruefung=prüfung pruefstand=prüfstand pruefzustand=prüfzustand " +
  "geprueft=geprüft ungeprueft=ungeprüft praefix=präfix rueckgabe=rückgabe schlaegt=schlägt schliessen=schließen schliesst=schließt " +
  "ueber=über vollstaendig=vollständig vollstaendiges=vollständiges vorgaenge=vorgänge waechter=wächter zustaendig=zuständig " +
  "ausfuehren=ausführen ausgefuehrt=ausgeführt benoetigt=benötigt waehlen=wählen oeffnen=öffnen moeglich=möglich verfuegbar=verfügbar " +
  "gueltig=gültig ungueltig=ungültig zurueck=zurück spaeter=später frueher=früher aelter=älter aeltere=ältere natuerlich=natürlich " +
  "hinzufuegen=hinzufügen gepruefte=geprüfte unterstuetzt=unterstützt"
).split(" ").map((p) => p.split("=")));
const WORTE = new Map(Object.entries({
  id: "ID", url: "URL", uri: "URI", ns: "Namespace", cpu: "CPU", gpu: "GPU", ram: "RAM", ip: "IP", dns: "DNS", tls: "TLS",
  ssh: "SSH", sha: "SHA", md5: "MD5", api: "API", hub: "Hub", rows: "Zeilen", row: "Zeile", count: "Anzahl", total: "Gesamt",
  name: "Name", status: "Status", error: "Fehler", errors: "Fehler", warning: "Warnung", warnings: "Warnungen", ok: "OK", mean: "Mittel",
  suspend: "pausiert", schedule: "Zeitplan", reason: "Grund", message: "Meldung", restarts: "Neustarts", ready: "bereit", node: "Knoten",
  nodes: "Knoten", image: "Image", severity: "Schweregrad", title: "Titel", type: "Typ", kind: "Art", owner: "Besitzer", assignee: "Zuständig",
  open: "offen", closed: "geschlossen", unique: "eindeutig", endpoint: "Endpunkt", by: "nach", age: "Alter", created: "erstellt",
  updated: "geändert", last: "letzter", value: "Wert", values: "Werte", result: "Ergebnis", path: "Pfad", file: "Datei", files: "Dateien",
  size: "Größe", time: "Zeit", date: "Datum", host: "Host", port: "Port", service: "Dienst", services: "Dienste", namespace: "Namespace",
  commit: "Commit", branch: "Branch", digest: "Digest", version: "Version", priority: "Priorität", labels: "Etiketten", label: "Etikett",
  // Hauptwörter aus deutschen Schlüsseln („mit_erfolg“ → „Mit Erfolg“); Eigenschaftswörter („erfolgreich“) bleiben klein
  erfolg: "Erfolg", erfolge: "Erfolge", fehler: "Fehler", lauf: "Lauf", laeufe: "Läufe", dauer: "Dauer", stand: "Stand", anzahl: "Anzahl",
  summe: "Summe", mittelwert: "Mittelwert", maximum: "Maximum", minimum: "Minimum", treffer: "Treffer", eintraege: "Einträge", eintrag: "Eintrag",
  vorgaenge: "Vorgänge", vorgang: "Vorgang", quelle: "Quelle", ziel: "Ziel", inhalt: "Inhalt", bericht: "Bericht", hinweis: "Hinweis",
  hinweise: "Hinweise", meldung: "Meldung", meldungen: "Meldungen", zahl: "Zahl", liste: "Liste", ergebnis: "Ergebnis", dienst: "Dienst",
  knoten: "Knoten", grund: "Grund", wartezeit: "Wartezeit", zeitraum: "Zeitraum", zeitpunkt: "Zeitpunkt", beginn: "Beginn", ende: "Ende",
  start: "Start", besitzer: "Besitzer", zustand: "Zustand", auftrag: "Auftrag", auftraege: "Aufträge", agent: "Agent", agenten: "Agenten",
  modell: "Modell", modelle: "Modelle", werkzeug: "Werkzeug", werkzeuge: "Werkzeuge", art: "Art", ort: "Ort", text: "Text", gesamt: "Gesamt",
  woche: "Woche", wochen: "Wochen", tag: "Tag", tage: "Tage", stunde: "Stunde", stunden: "Stunden", monat: "Monat", monate: "Monate",
  speicher: "Speicher", auslastung: "Auslastung", temperatur: "Temperatur", leistung: "Leistung", gruppe: "Gruppe", gruppen: "Gruppen",
}));
const EINHEITEN = new Map(Object.entries({
  s: "s", ms: "ms", min: "Min.", std: "Std.", h: "Std.", tage: "Tage", stunden: "Std.", minuten: "Min.", sekunden: "s",
  pct: "%", prozent: "%", mb: "MB", gb: "GB", kb: "KB", mib: "MiB", gib: "GiB", bytes: "Bytes",
}));

/** Werte und Feldnamen, die ein Hilfetext beim Namen nennt („bei an/aus“, „suche: …“, „genau eines von minuten/bis“), stehen als Beschriftung der Auswahl bzw. des Feldes da. */

  const spanne = xs[xs.length - 1] - xs[0];
  const xText = (x) => art === "zeit" ? (spanne < 400 * TAG ? App.zeit.tag(x, true) : App.zeit.datum(x)) : art === "zahl" ? zahlText(x) : marken[Math.round(x)] || "";
  const karten = reihen.map((r) => new Map(r.punkte.filter((p) => p.y !== null).map((p) => [p.x, p.y])));
  const zeilen = xs.slice(0, 200);
  ziel.innerHTML = `<div class="tabwrap"><table><thead><tr><th>${art === "zeit" ? "Zeitpunkt" : "Messpunkt"}</th>${reihen.map((r) => `<th class="zahl">${esc(r.name)}</th>`).join("")}</tr></thead><tbody>`
    + zeilen.map((x) => `<tr><td data-l="${art === "zeit" ? "Zeitpunkt" : "Messpunkt"}">${esc(xText(x))}</td>${reihen.map((r, k) => `<td class="zahl" data-l="${esc(r.name)}">${karten[k].has(x) ? esc(zahlText(karten[k].get(x))) : '<span class="leise">—</span>'}</td>`).join("")}</tr>`).join("")
    + "</tbody></table></div>" + (xs.length > 200 ? `<p class="mut">200 von ${xs.length} Werten gezeigt.</p>` : "");
  tabellenForm(ziel);
}

// ── Ergebnisse, die andere schicken (werkstatt.zeigen) ────────────────────────────────
function zeigen(d) {
  document.body.classList.add("nur-ergebnis"); ansicht(true);
  $("neu").hidden = true; $("liste").innerHTML = ""; $("skript").innerHTML = ""; ergebnisLeeren();
  letztesErgebnis = { daten: d.daten };
  const form = formVon(d.daten), sym = { text: "file-text", kurve: "chart-line", tabelle: "table", liste: "list", objekt: "braces", wert: "braces" }[form];
  const n = Array.isArray(d.daten) ? d.daten.length : istObjekt(d.daten) ? Object.keys(d.daten).length : typeof d.daten === "string" ? d.daten.replace(/\s+$/, "").split("\n").length : 1; // der Zeilenumbruch am Ende zählt nicht als Zeile
  const zusammen = {
    text: `Text · ${n} ${n === 1 ? "Zeile" : "Zeilen"}`,
    kurve: `Diagramm · ${istPunkte(d.daten) ? "1 Reihe" : Object.keys(d.daten).length + " Reihen"}`,
    tabelle: `Tabelle · ${n} ${n === 1 ? "Zeile" : "Zeilen"}`,
    liste: `Liste · ${n} ${n === 1 ? "Eintrag" : "Einträge"}`,
    objekt: `Übersicht · ${n} ${n === 1 ? "Angabe" : "Angaben"}`,
    wert: "Wert",
  }[form];
  satz(zusammen);
  const text = ablagetext({ daten: d.daten });
  $("ergebnis").innerHTML = `<div class="zeigen-kopf">${kachel(sym, "akz", "gross")}<div class="skript-text"><h2>${esc(deutsch(d.titel))}</h2>${d.notiz ? `<p>${esc(d.notiz)}</p>` : ""}</div>`
    + (text && form !== "text" ? `<button type="button" class="zweit klein kopie nur-sym" data-kopie="alles" title="Kopieren" aria-label="Kopieren">${symbol("copy")}<span class="beschriftung">Kopieren</span></button>` : "") + `</div><div id="daten"></div>`;
  zeichnen($("daten"), d.daten, 0, true); // die Zahl der Zeilen steht schon im Satz oben
}

// ── Protokoll ──────────────────────────────────────────────────────────────────
App.auf("ui/notifications/tool-input", (p) => { eingabe = (p && p.arguments) || {}; });
App.auf("ui/notifications/tool-result", async (r) => {
  bekommen = true; suchNr++; // eine schon laufende Suche darf das Ergebnis nicht überschreiben
  if (r && r.isError) {
    suchen();
    const f = skriptFehler(((r.content || [])[0] || {}).text);
    ansicht(true); $("skript").innerHTML = "";
    $("ergebnis").innerHTML = '<div class="karte">' + zustand({ symbol: "circle-alert", ton: "schlecht", titel: f.titel, text: f.text, klein: true }) + "</div>";
    satz(f.weg ? "Skript nicht gefunden" : "Das hat nicht geklappt", "schlecht");
    return;
  }
  const d = App.daten(r);
  if (!d) return suchen();
  if (d.art === "zeigen") return zeigen(d);
  if (d.art === "liste") {
    if (eingabe.q) $("q").value = eingabe.q;
    if (eingabe.wirkung) wirkungFilter = eingabe.wirkung;
    if (eingabe.ort) { bekannteOrte = new Set([...(bekannteOrte || []), eingabe.ort]); filterZeigen(); $("ort").value = eingabe.ort; }
    filterZeigen();
    return liste(d);
  }
  await suchen();
  if (d.art === "skript") return skript(d);
  if (d.art === "lauf") { await oeffnen(d.id, eingabe.argumente); lauf(d); }
});
$("skript").innerHTML = leerStart();
App.start("fyos-werkstatt").then(() => setTimeout(() => { if (!bekommen) suchen(); }, 1500)).catch(() => {});
</script>
