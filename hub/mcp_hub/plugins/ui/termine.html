<!doctype html>
<html lang="de" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Termine</title>
<style>/*STIL*/
  /* Eigene Klassen der App tragen den Vorsatz t- (die Klassen der gemeinsamen Schicht gehören _stil.css) */
  .t-form { display: flex; flex-direction: column; gap: 8px; margin: 0 0 12px; }
  .t-form label { font-size: 12.5px; color: var(--mut); }
  .t-form .t-zeile { display: flex; flex-wrap: wrap; gap: 8px; }
  .t-form input { flex: 1 1 200px; min-width: 0; }
  .t-ziel { margin: 0 0 12px; padding: 10px 12px; border: 1px dashed var(--line-2); border-radius: 12px; color: var(--mut); font-size: 13px; }
  #planung:empty, #antrag:empty { display: none; }
  #planung, #antrag { margin: 0 0 12px; }
  /* Eine Ansicht je Größe (Entscheidung 507): Hinweiszeile unter der Karte */
  .t-mehr { padding: 8px 4px 0; }
</style>
</head>
<body>
<!--KOPF-->
  <button id="knopf-neuladen" class="rund drehen" title="Aktualisieren" aria-label="Aktualisieren"><svg class="ico" data-symbol="refresh-cw"></svg></button>
<!--/KOPF-->
<main>
  <div id="planung"></div>
  <div id="antrag"></div>
  <div class="t-ziel" data-ab="normal">Zieh einen Vorgang hierher, um daraus einen Termin zu machen. Du wählst den Zeitpunkt; angelegt wird erst nach „Ja“.</div>
  <div id="liste"><div class="laedt">Lädt …</div></div>
</main>
<script>
/*BRUECKE*/
const $ = (id) => document.getElementById(id);
const { esc, symbol, zustand, satz } = App;
const rufen = (name, args) => App.rufen("termine__" + name, args);

let termine = [];
let zustandText = "";
let meldung = "";
let bekommen = false;

function wann(t) {
  const von = Date.parse(t.start);
  if (t.ganztaegig) return App.zeit.voll(von).split(",")[0] + " (ganztägig)";
  return App.zeit.voll(von);
}

// Eine Ansicht je Größe (Entscheidung 507): Tage als „JJJJ-MM-TT“ in Berliner Zeit, wie die Zeitangaben der App
const tagKey = (ms) => new Date(ms).toLocaleDateString("sv-SE", { timeZone: "Europe/Berlin" });
const tagPlus = (key, n) => { const [j, m, d] = key.split("-").map(Number); return new Date(Date.UTC(j, m - 1, d + n)).toISOString().slice(0, 10); };
const WOCHENTAG = ["So.", "Mo.", "Di.", "Mi.", "Do.", "Fr.", "Sa."];
function tagName(key) { // „Mi., 21. Okt.“
  const [j, m, d] = key.split("-").map(Number), t = new Date(Date.UTC(j, m - 1, d, 12));
  return `${WOCHENTAG[t.getUTCDay()]}, ${App.zeit.tag(t)}`;
}
// Erster und letzter Tag eines Termins (letzter eingeschlossen). Ganztägig: „ende“ ist der Tag danach, nicht eingeschlossen.
function tagesSpanne(t) {
  if (t.ganztaegig) {
    const erster = t.start.slice(0, 10), nach = (t.ende || t.start).slice(0, 10);
    return [erster, nach > erster ? tagPlus(nach, -1) : erster];
  }
  const von = Date.parse(t.start), bis = Date.parse(t.ende || t.start), erster = tagKey(von);
  return [erster, bis > von ? tagKey(bis - 1) : erster];
}

// Eine Ansicht je Größe (Entscheidung 507): blick nur der nächste Termin und die Zahl der weiteren heute, kompakt heute
// und morgen, weit die ganze Woche nach Tagen mit Ort und Details. Dieselben Daten; normal zeichnet wie gebaut (zeichnen).
function zeichneStufe() {
  const stufe = App.stufe, jetzt = Date.now(), heute = tagKey(jetzt), morgen = tagPlus(heute, 1);
  // Beendete Termine fallen weg, auch wenn die Liste schon älter ist; ganztägige gelten bis zu ihrem letzten Tag
  const offen = termine.filter((t) => (t.ganztaegig ? tagesSpanne(t)[1] >= heute : Date.parse(t.ende || t.start) > jetzt));
  // Ein Termin zählt zu dem Tag, an dem er beginnt; was schon läuft, zählt zu heute
  const tagVon = (t) => { const a = tagesSpanne(t)[0]; return a < heute ? heute : a; };
  const tagWort = (k) => (k === heute ? "heute" : k === morgen ? "morgen" : tagName(k));
  const tagTitel = (k) => (k === heute ? `Heute · ${tagName(k)}` : k === morgen ? `Morgen · ${tagName(k)}` : tagName(k));
  const leer = (satzText, text) => {
    satz(satzText, "");
    $("liste").innerHTML = '<div class="karte">' + zustand({ symbol: "calendar-days", titel: "Keine Termine", text, klein: true }) + "</div>";
  };
  const uhr = (t) => {
    if (t.ganztaegig) return "ganztägig";
    const von = Date.parse(t.start), bis = Date.parse(t.ende || t.start);
    if (von <= jetzt && bis > jetzt) return "läuft bis " + (tagesSpanne(t)[1] === heute ? App.zeit.uhr(bis) : App.zeit.tag(bis, true));
    return App.zeit.uhr(von);
  };
  const zeitText = (t) => {
    if (t.ganztaegig) { const [a, b] = tagesSpanne(t); return a === b ? "ganztägig" : `ganztägig bis ${tagName(b)}`; }
    const von = Date.parse(t.start), bis = Date.parse(t.ende || t.start), [a, b] = tagesSpanne(t);
    if (bis <= von) return App.zeit.uhr(von);
    return a === b ? `${App.zeit.uhr(von)}–${App.zeit.uhr(bis)}` : `${App.zeit.tag(von, true)} – ${App.zeit.tag(bis, true)}`;
  };
  const terminZeile = (t, unter) => `<div class="zeile mitte"><span class="zeile-text"><span class="zeile-titel">${esc(t.titel)}</span><span class="zeile-unter">${esc(unter)}</span></span></div>`;

  if (stufe === "blick") {
    const heuteOffen = offen.filter((t) => tagVon(t) === heute);
    const naechster = heuteOffen.find((t) => !t.ganztaegig) || offen[0];
    if (!naechster) return leer("Keine Termine", "In den nächsten Tagen steht nichts an.");
    const weitere = heuteOffen.filter((t) => t !== naechster).length;
    satz("Nächster Termin", "gut");
    $("liste").innerHTML = '<div class="karte zeilen">' + terminZeile(naechster, `${tagWort(tagVon(naechster))}, ${uhr(naechster)}`) + "</div>"
      + `<div class="mut t-mehr">${weitere === 0 ? "heute keine weiteren" : weitere === 1 ? "heute 1 weiterer" : `heute ${weitere} weitere`}</div>`;
    return;
  }

  if (stufe === "kompakt") {
    const heuteListe = offen.filter((t) => tagVon(t) === heute), morgenListe = offen.filter((t) => tagVon(t) === morgen);
    if (!heuteListe.length && !morgenListe.length) return leer("Heute und morgen frei", "Heute und morgen steht nichts an.");
    satz(`${heuteListe.length ? heuteListe.length + " heute" : "heute frei"} · ${morgenListe.length ? morgenListe.length + " morgen" : "morgen frei"}`, "gut");
    // Eine kurze Liste (App.anzahl Zeilen); jeder Tag bekommt die Hälfte, ein Tag ohne Termine gibt den Rest ab
    const max = App.anzahl({ kompakt: 5 });
    let zeigeHeute = Math.min(heuteListe.length, Math.ceil(max / 2));
    const zeigeMorgen = Math.min(morgenListe.length, max - zeigeHeute);
    zeigeHeute = Math.min(heuteListe.length, max - zeigeMorgen);
    const reihen = [
      ...heuteListe.slice(0, zeigeHeute).map((t) => terminZeile(t, uhr(t))),
      ...morgenListe.slice(0, zeigeMorgen).map((t) => terminZeile(t, `morgen, ${uhr(t)}`)),
    ];
    const rest = heuteListe.length + morgenListe.length - reihen.length;
    $("liste").innerHTML = '<div class="karte zeilen">' + reihen.join("") + "</div>"
      + (rest > 0 ? `<div class="mut t-mehr">${rest === 1 ? "1 weiterer Termin" : `${rest} weitere Termine`} im größeren Fenster</div>` : "");
    return;
  }

  // weit: alle Tage des Fensters, je Tag eine Karte mit Ort und Details (das Werkzeug liefert 14 Tage)
  if (!offen.length) return leer("Keine Termine", "In den nächsten Tagen steht nichts an.");
  satz(`${offen.length} Termin${offen.length === 1 ? "" : "e"} in den nächsten Tagen`, "gut");
  const nachTag = new Map();
  for (const t of offen) nachTag.set(tagVon(t), [...(nachTag.get(tagVon(t)) || []), t]);
  $("liste").innerHTML = '<div class="raster">' + [...nachTag].map(([k, liste]) => `<section class="karte"><h2>${tagTitel(k)}<span class="anzahl">${liste.length}</span></h2>`
    + `<div class="zeilen">${liste.map((t) => terminZeile(t, [zeitText(t), t.ort, t.kalender].filter(Boolean).join(" · "))).join("")}</div></section>`).join("") + "</div>";
}

function zeichnen() {
  if (zustandText === "nicht eingerichtet") {
    satz("Kein Kalender eingerichtet", "warn");
    $("liste").innerHTML = '<div class="karte">' + zustand({ symbol: "calendar-days", ton: "warn", titel: "Kein Kalender eingerichtet", text: meldung || "Trag einen Termin-Dienst ein oder installiere das Kalender-Plugin." }) + "</div>";
    return;
  }
  if (zustandText === "fehler") {
    $("liste").innerHTML = '<div class="karte">' + zustand({ symbol: "circle-alert", ton: "schlecht", titel: "Der Kalender antwortet nicht", text: meldung, klein: true }) + "</div>";
    return;
  }
  if (App.stufe !== "normal") return zeichneStufe(); // Eine Ansicht je Größe (Entscheidung 507)
  satz(termine.length ? `${termine.length} Termin${termine.length === 1 ? "" : "e"} in den nächsten Tagen` : "Keine Termine", termine.length ? "gut" : "");
  if (!termine.length) {
    $("liste").innerHTML = '<div class="karte">' + zustand({ symbol: "calendar-days", titel: "Keine Termine", text: "In den nächsten Tagen steht nichts an.", klein: true }) + "</div>";
    return;
  }
  $("liste").innerHTML = '<div class="karte zeilen">' + termine.map((t) =>
    `<div class="zeile mitte"><span class="zeile-text"><span class="zeile-titel">${esc(t.titel)}</span><span class="zeile-unter">${esc(wann(t))}${t.ort ? " · " + esc(t.ort) : ""}${t.kalender ? " · " + esc(t.kalender) : ""}</span></span></div>`).join("") + "</div>";
}

async function laden() {
  try {
    const d = await rufen("zeigen");
    zustandText = d.zustand === "ok" ? "" : (d.zustand || "");
    meldung = d.hinweis || d.error || "";
    termine = Array.isArray(d.termine) ? d.termine : [];
    bekommen = true;
  } catch (e) { zustandText = "fehler"; meldung = App.fehlertext(e); }
  zeichnen();
}

// Ein Vorgang fiel auf das Fenster: Zeitpunkt abfragen, dann Plan und „Ja“ (App.beantragen), erst danach wird etwas angelegt.
function annehmen(u) {
  if (u.typ !== "vorgang") return;
  const morgen = new Date(Date.now() + 86400000); morgen.setHours(9, 0, 0, 0);
  const vorgabe = new Date(morgen.getTime() - morgen.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  $("planung").innerHTML = `<form id="termin-form" class="t-form karte" autocomplete="off">`
    + `<label for="termin-titel">Titel</label><input id="termin-titel" type="text" maxlength="200" value="${esc(u.argumente.titel || u.label)}">`
    + `<label for="termin-start">Wann</label><div class="t-zeile"><input id="termin-start" type="datetime-local" value="${esc(vorgabe)}" required></div>`
    + `<div class="aktionen"><button type="submit" class="haupt">${symbol("calendar-plus")}Plan ansehen</button> <button type="button" class="zweit" id="termin-nein">Abbrechen</button></div></form>`;
  $("termin-nein").addEventListener("click", () => { $("planung").replaceChildren(); });
  $("termin-form").addEventListener("submit", async (ev) => {
    ev.preventDefault();
    const args = { ...u.argumente, titel: $("termin-titel").value.trim() || u.argumente.titel, start: $("termin-start").value };
    try {
      const r = await App.beantragen({ werkzeug: "termine__anlegen", args, ort: $("antrag"), ja: "Termin anlegen", symbol: "check" });
      if (r == null) return;
      $("planung").replaceChildren();
      satz((r && r.satz) || "Termin angelegt.", "gut");
      await laden();
    } catch (e) { satz(App.fehlertext(e), "schlecht"); }
  });
}

$("knopf-neuladen").addEventListener("click", laden);
App.ablage($("antrag"), { nimmt: ["vorgang"], bei: annehmen });
App.auf("ui/notifications/tool-result", (r) => { const d = App.daten(r); if (d && Array.isArray(d.termine)) { bekommen = true; zustandText = d.zustand === "ok" ? "" : (d.zustand || ""); termine = d.termine; zeichnen(); } });
// Andere Kachelgröße, andere Ansicht (Entscheidung 507); die Zeitbezüge (heute, läuft, beendet) rechnen mit der Uhr, darum minütlich nach
window.addEventListener("app-stufe", () => { if (bekommen || zustandText) zeichnen(); });
App.takt(60000, () => { if (bekommen && App.stufe !== "normal") zeichnen(); });
App.start("fyos-termine").then(() => setTimeout(() => { if (!bekommen) laden(); }, 1500)).catch(() => {});
</script>
</body>
</html>
