<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MCP</title>
<style>/*STIL*/
  #meldung { margin: 0 0 14px; }
  #reiter { margin: 0 0 16px; }
  #reiter .ico { font-size: 15px; margin-right: 1px; }

  /* ── Werkzeugkasten: Plugins | Werkzeuge | Detail. Schmal: eine Spalte, Zurück-Knopf führt eine Stufe hoch. ── */
  .k-kasten { display: grid; gap: 14px; }
  .k-kasten > .k-sp { display: none; min-width: 0; }
  .k-kasten[data-pane="plugins"] > .k-sp-plugins,
  .k-kasten[data-pane="werkzeuge"] > .k-sp-werkzeuge,
  .k-kasten[data-pane="detail"] > .k-sp-detail { display: block; }
  .k-sp > h2 { margin-top: 0; }
  .k-zurueck { margin: 0 0 12px -6px; }
  .k-liste { min-width: 0; }
  .k-pl { min-height: 42px; padding: 7px 12px; gap: 10px; }
  .k-pl .zeile-titel { font-size: 13.5px; }
  .k-pl .zeile-ende { font-size: 12px; }
  .k-pl.alle .zeile-titel { font-weight: var(--font-weight-semibold); }
  .k-pl .punkt { margin-left: 2px; }
  .k-wz { min-height: 52px; padding: 8px 12px; }
  .k-wz .zeile-unter { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .k-wz .zeile-titel code { overflow-wrap: anywhere; }
  .k-wz-marken { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 5px; }
  .k-mehr { width: 100%; border-radius: 0; border: 0; border-top: 1px solid var(--line); min-height: 42px; color: var(--akz); box-shadow: none; background: transparent; }

  /* Kopf eines Plugins über der Werkzeugliste */
  .k-plugin { margin: 0 0 12px; padding: 13px 15px; }
  .k-plugin-kopf { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; }
  .k-plugin-name { font-size: 15px; font-weight: var(--font-weight-semibold); letter-spacing: -0.01em; overflow-wrap: anywhere; }
  .k-plugin p { margin: 6px 0 0; font-size: 13px; line-height: 1.5; color: var(--mut); }
  .k-plugin .hinweis { margin-top: 10px; font-size: 12.5px; padding: 9px 12px; }
  .k-leiste { margin: 0 0 10px; }
  .k-leiste .chip { min-height: 30px; padding: 0 11px; font-size: 12.5px; }

  /* Detail */
  .k-kopf { display: flex; align-items: flex-start; gap: 12px; margin: 0 0 12px; }
  .k-kopf-text { min-width: 0; flex: 1 1 auto; }
  .k-name { margin: 0; font-size: 18px; line-height: 1.3; font-weight: var(--font-weight-semibold); letter-spacing: -0.012em; overflow-wrap: anywhere; }
  .k-name .k-plugin-teil { color: var(--mut); font-weight: var(--font-weight-normal); }
  .k-titel { margin: 1px 0 0; font-size: 13px; color: var(--mut); }
  .k-marken { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 0; }
  .k-text { margin: 0 0 14px; font-size: 13.5px; line-height: 1.6; color: var(--mut); white-space: pre-line; overflow-wrap: anywhere; }
  .k-text.lang { max-height: 11.5em; overflow: auto; padding-right: 4px; }
  .k-felder { display: grid; gap: 14px; padding: 15px 16px; }
  .k-feld { display: grid; gap: 6px; min-width: 0; }
  .k-feldkopf { display: flex; align-items: center; flex-wrap: wrap; gap: 4px 8px; font-size: 13px; font-weight: var(--font-weight-medium); color: var(--fg); }
  .k-feldkopf code { font-weight: var(--font-weight-semibold); }
  .k-feld .zeile-unter { font-weight: var(--font-weight-normal); }
  .k-feld :where(input, select, textarea) { width: 100%; }
  .k-feld textarea { font-family: var(--mono); font-size: 12.5px; min-height: 64px; }
  .k-feld.fehler :where(input, select, textarea) { border-color: color-mix(in oklab, var(--schlecht) 60%, transparent); }
  .k-aktion { display: flex; flex-wrap: wrap; align-items: center; gap: 10px 12px; margin: 14px 0 0; }
  .k-aktion .mut { flex: 1 1 200px; }
  .k-abschnitt { margin-top: 20px; }
  .k-abschnitt > h2 { margin-bottom: 8px; }
  .k-pre { margin: 0; max-height: 360px; }
  .k-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; margin: 0 0 8px; font-size: 12.5px; color: var(--mut); }
  .k-app { display: flex; align-items: center; gap: 13px; padding: 13px 15px; }
  .k-app .zeile-text { flex: 1 1 auto; }
  .k-app > .kachel { align-self: center; }
  .k-roh summary { margin-top: 6px; }
  .k-leer-detail { display: none; }
  dl.k-erreichbar { margin: 0; }

  /* Apps */
  .k-appkarte { display: flex; flex-direction: column; gap: 12px; padding: 16px 17px; }
  .k-appkopf { display: flex; align-items: center; gap: 13px; }
  .k-appkopf .zeile-titel { font-size: 16px; font-weight: var(--font-weight-semibold); }
  .k-appkarte dl.kv { margin: 0; }
  .k-appkarte .knoepfe { margin-top: auto; }
  .k-chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .k-chips .chip { min-height: 26px; padding: 0 9px; font-size: 12px; font-family: var(--mono); }

  /* Protokolle */
  .k-zugang { padding: 15px 17px; display: grid; gap: 9px; }
  .k-zugang-kopf { display: flex; align-items: center; gap: 12px; }
  .k-zugang-kopf .zeile-titel { font-size: 15px; font-weight: var(--font-weight-semibold); }
  .k-versionen { display: flex; flex-wrap: wrap; gap: 6px; }
  .k-versionen .marke { font-family: var(--mono); font-size: 11.5px; }
  .k-zugang p { margin: 0; font-size: 13px; line-height: 1.5; color: var(--mut); }
  #haupt > .abschnitt + .abschnitt { margin-top: 26px; }

  @media (min-width: 820px) {
    .k-kasten { grid-template-columns: 208px minmax(0, 1fr) minmax(0, 1.28fr); align-items: start; gap: 18px; }
    .k-kasten > .k-sp { display: block; }
    .k-zurueck { display: none; }
    .k-scroll { max-height: 640px; overflow-y: auto; border-radius: var(--r-l); }
    /* In FYOS wächst das Fenster mit, nur die Fläche scrollt (_stil.css Abschnitt 13) */
    html[data-host="fyos"][data-rahmen="frei"] .k-scroll { max-height: none; }
    .k-scroll > .gruppe { overflow: visible; }
    .k-kasten .k-sp-detail { position: relative; }
    .k-leer-detail { display: block; }
  }
  @media (max-width: 480px) {
    .k-name { font-size: 17px; }
    .k-felder { padding: 14px; }
    .k-aktion .haupt { width: 100%; min-height: 44px; }
    .k-appkarte { padding: 14px; }
    #reiter { display: flex; }
    #reiter button { flex: 1 1 0; padding: 0 8px; }
  }

  /* Eine Ansicht je Größe (Entscheidung 507): „N weitere im größeren Fenster“ */
  .k-weitere { padding: 10px 12px; font-size: 13px; color: var(--mut); text-align: center; }
  html[data-stufe="weit"] .k-wz .zeile-unter { -webkit-line-clamp: 3; }
  html[data-stufe="blick"] .k-wz .zeile-unter,
  html[data-stufe="kompakt"] .k-wz .zeile-unter { -webkit-line-clamp: 1; }
  html[data-stufe="kompakt"] .k-text { display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; max-height: none; }
  html[data-stufe="weit"] .k-text.lang { max-height: none; overflow: visible; }
</style>
</head>
<body data-breite="voll">
<!--KOPF-->
  <button id="neu" class="rund drehen" title="Aktualisieren" aria-label="Aktualisieren"><svg class="ico" data-symbol="refresh-cw"></svg></button>
<!--/KOPF-->
<div id="meldung" class="hinweis fehler" role="alert" hidden></div>
<nav class="reiter" id="reiter" role="tablist" aria-label="Ansicht" data-ab="kompakt" data-klebt hidden></nav>
<main id="haupt"><div class="laedt gross" data-t>Der Werkzeugkasten wird geladen …</div></main>

<script>
/*BRUECKE*/
const $ = (id) => document.getElementById(id);
const { esc, symbol, kachel, marke, zustand, satz } = App;
const rufen = (name, args) => App.rufen("mcp__" + name, args);
const fehlertext = App.fehlertext;
const T = App.t;
App.texte({
  "Betrieb": "Operations", "Wissen": "Knowledge", "Beispiele": "Examples", "Arbeit": "Work",
  "Ansicht": "View", "Der Werkzeugkasten wird geladen …": "The toolbox is loading …",
  "Lesen": "Read", "Schreiben": "Write", "Löschen": "Delete", "Ausführen": "Execute", "Extern": "External", "Scope offen": "Scope open",
  "Modell": "Model", "Ein Modell sieht und ruft das Werkzeug (über den Hub).": "A model sees and calls the tool (through the Hub).",
  "nur App": "app only", "Nur die Oberfläche der App ruft es; das Modell sieht es nicht.": "Only the app's interface calls it; the model does not see it.",
  "Modell + App": "Model + app", "Modell und Oberfläche der App sehen es.": "Model and the app's interface see it.",
  "gesund": "healthy", "gestört": "faulty", "nicht erreichbar": "unreachable", "abgeschaltet": "switched off", "nicht geladen": "not loaded",
  "Alle": "All", "Lesend": "Read-only", "Schreibend": "Writing", "Mit App": "With app",
  "1 weiteres im größeren Fenster": "1 more in a larger window", "{0} weitere im größeren Fenster": "{0} more in a larger window",
  "Plugin gestört": "plugin faulty", "Plugins gestört": "plugins faulty", "Alle Plugins gesund": "All plugins healthy",
  "Werkzeug": "tool", "Werkzeuge": "Tools", "werkzeuge": "tools", "App": "app", "Apps": "Apps", "apps": "apps", "nicht aktuell": "not current", "Protokolle": "Logs",
  "Alle Plugins": "All plugins", "Die Sicherung des Hubs hat dieses Plugin vorübergehend gesperrt": "The Hub's circuit breaker has blocked this plugin for now",
  "Sicherung {0}": "Breaker {0}", "Werkzeug suchen": "Search tool", "Nichts gefunden": "Nothing found",
  "Zu Suche und Filter passt kein Werkzeug.": "No tool matches the search and filter.", "Dieses Plugin hat keine Werkzeuge.": "This plugin has no tools.",
  "Zurücksetzen": "Reset", "Weitere {0} anzeigen": "Show {0} more", "Liste von {0}": "list of {0}", "Standard: {0}": "Default: {0}",
  "Bitte wählen": "Please choose", "– nicht gesetzt –": "– not set –", "Ja": "Yes", "Nein": "No", " Wertebereich {0} bis {1}.": " Range {0} to {1}.",
  " Darf leer bleiben.": " May stay empty.", "Pflicht": "Required", "Pflichtfeld": "Required field", "Bitte eine ganze Zahl eingeben": "Please enter a whole number",
  "Bitte eine Zahl eingeben": "Please enter a number", "Das ist kein gültiges JSON": "That is not valid JSON", "oder als eigenes MCP-Werkzeug": "or as an MCP tool of its own",
  "Wird aufgerufen …": "Calling …", "Ergebnis": "Result", "{0} Zeichen": "{0} characters", "gekürzt": "shortened", "Über den Hub": "Through the Hub", "mit": "with",
  "Eigenes MCP-Werkzeug": "MCP tool of its own", "Shell (Flächen-Werkzeug)": "Shell (surface tool)", "Nein, nur der MCP-Weg": "No, only the MCP route",
  "Öffnet den offiziellen MCP Inspector in einem neuen Tab (Anmeldung wie beim Dienst eingerichtet)": "Opens the official MCP Inspector in a new tab (sign-in as set up for the service)",
  "Im Inspector öffnen": "Open in Inspector", "Offizieller Inspector": "Official Inspector", "Voreingestellter Server": "Preset server",
  "Oberfläche": "Interface", " · der Link „In FYOS öffnen“ braucht Eingaben oder ist hier nicht erlaubt": " · the link “Open in FYOS” needs inputs or is not allowed here",
  "Ergebnisse über dem Budget kommen gekürzt ({0} Zeichen); ": "Results over the budget come shortened ({0} characters); ",
  " holt den Rest. Ein Feld, nach dem {0}-mal gefragt wurde, steht danach von selbst darin; {1} Tage ohne Nutzung, dann fällt es wieder heraus.": " fetches the rest. A field asked for {0} times is included by itself afterwards; after {1} days without use it drops out again.",
  "Kurze Ansicht für Modelle": "Short view for models", "Keine eigene Sicht: In Listen stehen die Kernfelder (": "No view of its own: lists show the core fields (",
  "mitgeliefert": "shipped", "gelernt · {0}× gefragt": "learned · asked {0}×", "{0} von {1} Nachfragen": "{0} of {1} requests", "oberste Ebene": "top level",
  "Werkzeug wählen": "Choose a tool", "Links ein Plugin, in der Mitte ein Werkzeug: hier stehen dann Beschreibung, Eingabe und der Weg, es zu rufen.": "A plugin on the left, a tool in the middle: then description, input and the way to call it appear here.",
  "Fläche": "Surface", "Details werden geladen …": "Loading details …", "Die Details lassen sich nicht laden": "The details cannot be loaded", "Erneut versuchen": "Try again",
  "Dieses Werkzeug braucht keine Eingabe.": "This tool needs no input.", "Hier nicht ausprobierbar.": "Cannot be tried here.", "Ausprobieren": "Try it",
  "Ruft das lesende Werkzeug wirklich auf; im Audit-Log steht es wie jeder Aufruf.": "Really calls the read-only tool; it shows up in the audit log like every call.",
  "Beschreibung, Eingabe und Aufruf im größeren Fenster": "Description, input and call in a larger window", "Keine Beschreibung.": "No description.",
  "Eingabe": "Input", "Aufruf": "Call", "Im Inspector: Tool": "In the Inspector: tool", "Wo erreichbar": "Where reachable", "JSON-Schema der Eingabe": "JSON schema of the input",
  "Die Antwort ist unvollständig.": "The answer is incomplete.", "Der Aufruf hat nicht geklappt.": "The call did not work.", "Keine Apps": "No apps",
  "Der Hub liefert gerade keine Werkzeuge mit Oberfläche.": "The Hub delivers no tools with an interface right now.", "Weitere": "More", "Im Werkzeugkasten zeigen": "Show in the toolbox",
  "keine MCP-Versionen (kein Handshake)": "no MCP versions (no handshake)", " · {0} freigegeben": " · {0} allowed", "{0} Anfragen mit dieser Version": "{0} requests with this version",
  "Alle Modelle": "All models", "{0} Aufrufe, {1} gekürzt · {2} → {3} Zeichen": "{0} calls, {1} shortened · {2} → {3} characters", " · {0}× nachgeholt ({1})": " · fetched {0}× more ({1})",
  "{0} % gespart": "{0} % saved", "Kurze Ansicht — Ersparnis {0} Tage": "Short view — savings {0} days", "Noch nichts gemessen": "Nothing measured yet",
  "Sobald ein Modell ein Werkzeug über den Hub ruft, steht es hier.": "As soon as a model calls a tool through the Hub, it appears here.",
  "Der Hub spricht beide Zeitalter: den Handshake (initialize) und die zustandslose Fassung 2026-07-28 (server/discover).": "The Hub speaks both eras: the handshake (initialize) and the stateless version 2026-07-28 (server/discover).",
  "Dieses SDK kennt nur den Handshake; 2026-07-28 spricht erst mcp 2.x.": "This SDK only knows the handshake; 2026-07-28 is spoken only by mcp 2.x.",
  "Protokollversionen": "Protocol versions", "Version {0}, gestartet {1}": "Version {0}, started {1}", "Zustandslos": "Stateless", "Zugänge": "Access routes",
  "Zuletzt gesehen": "Last seen", "Noch niemand seit dem Start": "Nobody since the start", "Sobald ein Client den Hub anspricht, steht er hier.": "As soon as a client talks to the Hub, it appears here.",
  "Oberflächen (ui://)": "Interfaces (ui://)", "Plugin {0}": "plugin {0}", "Keine Oberflächen": "No interfaces", "Kein Plugin liefert eine ui://-Ressource.": "No plugin delivers a ui:// resource.",
  "Der Werkzeugkasten ist nicht erreichbar": "The toolbox is unreachable", "Keine Verbindung": "No connection", "Das Aktualisieren hat nicht geklappt: {0}": "Refreshing did not work: {0}",
});

// ── Wörterbücher: Scope, Sichtbarkeit, Zustand der Plugins ─────────────────────────────────────
const SCOPE = {
  READ: { text: "Lesen", klasse: "lesen", symbol: "eye", ton: "gut" },
  WRITE: { text: "Schreiben", klasse: "schreiben", symbol: "pencil", ton: "warn" },
  DESTRUCTIVE: { text: "Löschen", klasse: "loeschen", symbol: "trash-2", ton: "schlecht" },
  EXEC: { text: "Ausführen", klasse: "system", symbol: "terminal", ton: "warn" },
  EXTERN: { text: "Extern", klasse: "akz", symbol: "globe", ton: "akz" },
  UNKNOWN: { text: "Scope offen", klasse: "gelb", symbol: "circle-help", ton: "grau" },
};
const SICHT = {
  modell: { text: "Modell", symbol: "bot", hilfe: "Ein Modell sieht und ruft das Werkzeug (über den Hub)." },
  app: { text: "nur App", symbol: "app-window", hilfe: "Nur die Oberfläche der App ruft es; das Modell sieht es nicht." },
  beide: { text: "Modell + App", symbol: "layers", hilfe: "Modell und Oberfläche der App sehen es." },
};
const STATUS = {
  ok: { text: "gesund", punkt: "gut" },
  krank: { text: "gestört", punkt: "schlecht" },
  unerreichbar: { text: "nicht erreichbar", punkt: "schlecht" },
  aus: { text: "abgeschaltet", punkt: "" },
  nicht_geladen: { text: "nicht geladen", punkt: "schlecht" },
};
const WEG = { mcp: { text: "MCP", symbol: "plug" }, rest: { text: "REST", symbol: "route" }, os: { text: "OS", symbol: "monitor" } };
const FILTER = [
  { id: "alle", text: "Alle" },
  { id: "lesen", text: "Lesend" },
  { id: "schreiben", text: "Schreibend" },
  { id: "app", text: "Mit App" },
];
const SEITE = 60; // Zeilen je Seite der Werkzeugliste

// ── Zustand ────────────────────────────────────────────────────────────────────────────────────
let daten = null, standZeit = 0, veraltet = false, bekommen = false, meldungUhr = null, vorwahl = "";
const S = { ansicht: "kasten", pane: "plugins", plugin: "", werkzeug: "", suche: "", filter: "alle", zeilen: SEITE };
const details = new Map();   // Werkzeug-Kennung → Antwort von mcp__werkzeug (oder { fehler })
const eingaben = new Map();  // Werkzeug-Kennung → { feld: Text }
const probe = new Map();     // Werkzeug-Kennung → { laeuft } | { ok, text, ms, zeichen, gekuerzt } | { fehler }
const feldFehler = new Map();// Werkzeug-Kennung → { feld: Text }

function melden(text) {
  clearTimeout(meldungUhr);
  $("meldung").innerHTML = text ? symbol("circle-alert") + `<span>${esc(T(text))}</span>` : "";
  $("meldung").hidden = !text;
  if (text) meldungUhr = setTimeout(() => { $("meldung").hidden = true; }, 15000);
}
async function oeffnen(url) {
  if (!/^https?:\/\//i.test(url || "")) return;
  try { await App.anfrage("ui/open-link", { url }); } catch { try { window.open(url, "_blank", "noopener"); } catch {} }
}
// Titel und Untertitel einer App in der Sprache der Oberfläche (englische Fassung aus _identitaet.py, falls vorhanden)
const sprachTitel = (a) => (App.sprache === "en" && a.titel_en ? a.titel_en : a.titel);
const sprachUntertitel = (a) => (App.sprache === "en" && a.untertitel_en ? a.untertitel_en : a.untertitel);
const appVon = (uri) => (daten && uri ? daten.apps.find((a) => a.uri === uri) : null) || null;
const werkzeugVon = (id) => (daten ? daten.werkzeuge.find((w) => w.id === id) : null) || null;
const pluginVon = (name) => (daten ? daten.plugins.find((p) => p.name === name) : null) || null;
const zahlWort = (n, eins, viele) => `${n} ${T(n === 1 ? eins : viele)}`;
// Eine Ansicht je Größe (Entscheidung 507): Hinweis unter einer gekürzten Liste, und die Liste selbst je Stufe
const weitereZeile = (n) => `<div class="k-weitere">${esc(n === 1 ? T("1 weiteres im größeren Fenster") : T("{0} weitere im größeren Fenster", n))}</div>`;
const kurzeListe = (liste, zeile) => { // im Blick drei, kompakt sechs Zeilen, der Rest als Hinweis
  const n = App.anzahl({ blick: 3, kompakt: 6 }), rest = liste.length - Math.min(liste.length, n);
  return `<ul class="zeilen">${liste.slice(0, n).map(zeile).join("")}</ul>` + (rest > 0 ? weitereZeile(rest) : "");
};

// ── Kopfsatz ───────────────────────────────────────────────────────────────────────────────────
function zeichneSatz() {
  if (!daten) return;
  const z = daten.zaehler;
  const gestoert = z.krank + z.unerreichbar + z.nicht_geladen;
  const teile = [gestoert ? `${zahlWort(gestoert, "Plugin gestört", "Plugins gestört")}` : "Alle Plugins gesund",
    zahlWort(z.werkzeuge, "Werkzeug", "werkzeuge"), zahlWort(z.apps, "App", "apps"), App.zeit.uhr(standZeit)];
  if (veraltet) teile.push("nicht aktuell");
  satz(teile.join(" · "), veraltet ? "warn" : gestoert ? "schlecht" : "gut");
}

// ── Ansichten ──────────────────────────────────────────────────────────────────────────────────
const ANSICHTEN = [
  { id: "kasten", text: "Werkzeuge", symbol: "toolbox" },
  { id: "apps", text: "Apps", symbol: "layout-grid" },
  { id: "protokolle", text: "Protokolle", symbol: "waypoints" },
];
function zeichneReiter() {
  const r = $("reiter");
  r.hidden = !daten;
  r.innerHTML = ANSICHTEN.map((a) => `<button type="button" role="tab" id="tab-${a.id}" data-ansicht="${a.id}" aria-selected="${S.ansicht === a.id}">${symbol(a.symbol)}${esc(T(a.text))}</button>`).join("");
}
function zeichnen() {
  if (!daten) return;
  zeichneSatz();
  zeichneReiter();
  const ort = $("haupt");
  // Eine Ansicht je Größe (Entscheidung 507): im Blick bleibt es beim Werkzeugkasten, die Reiter fallen dort weg
  const ansicht = App.stufe === "blick" ? "kasten" : S.ansicht;
  if (ansicht === "apps") ort.innerHTML = appsHtml();
  else if (ansicht === "protokolle") ort.innerHTML = protokolleHtml();
  else { ort.innerHTML = kastenHtml(); zeichneListe(); zeichneDetail(); }
}

// ── Werkzeugkasten: Plugins ────────────────────────────────────────────────────────────────────
function pluginReihe(p) {
  const st = STATUS[p.status] || STATUS.krank;
  const an = S.plugin === p.name;
  return `<button type="button" class="zeile mitte k-pl${an ? " an" : ""}" data-plugin="${esc(p.name)}"${an ? ' aria-current="true"' : ""} title="${esc(p.name)} · ${esc(T(st.text))}">`
    + `<span class="punkt ${st.punkt}" aria-hidden="true"></span>`

function feldHtml(f, id, an) {

  } else if (f.typ === "array" || f.typ === "object" || f.typ === "any") {

  }
  const grenze = f.von != null || f.bis != null ? T(" Wertebereich {0} bis {1}.", f.von != null ? f.von : "…", f.bis != null ? f.bis : "…") : "";

/** Texte aus dem Formular → Argumente. Wirft keine Fehler, sondern sammelt sie je Feld. */
function argumente(felder, werte, streng) {
  const args = {}, fehler = {};
  for (const f of felder) {
    const roh = werte[f.name];
    if (roh == null || String(roh).trim() === "") {
      if (f.pflicht && streng) fehler[f.name] = T("Pflichtfeld");
      continue;
    }
    const t = String(roh).trim();
    try {
      if (f.auswahl && f.auswahl.length) {
        const treffer = f.auswahl.find((o) => String(o) === t);
        args[f.name] = treffer === undefined ? t : treffer;
      } else if (f.typ === "integer") {
        if (!/^-?\d+$/.test(t)) throw new Error(T("Bitte eine ganze Zahl eingeben"));
        args[f.name] = Number(t);
      } else if (f.typ === "number") {
        if (isNaN(Number(t))) throw new Error(T("Bitte eine Zahl eingeben"));
        args[f.name] = Number(t);
      } else if (f.typ === "boolean") args[f.name] = t === "ja";
      else if (f.typ === "array" || f.typ === "object" || f.typ === "any") args[f.name] = JSON.parse(t);
      else args[f.name] = String(roh);
    } catch (e) {
      fehler[f.name] = e instanceof SyntaxError ? T("Das ist kein gültiges JSON") : e.message;
    }
  }
  return { args, fehler };
}
function aufrufText(w, d) {
  const { args } = argumente(d.eingabefelder || [], eingaben.get(w.id) || {}, false);
  const json = (o) => JSON.stringify(o, null, 2);
  let t = `hub__call_tool\n${json({ tool: w.id, arguments: args })}`;
  if (w.mcp_name) t += `\n\n${T("oder als eigenes MCP-Werkzeug")}\n${w.mcp_name}\n${json(args)}`;
  return t;
}

    + kurzeAnsichtHtml(d)
    + `<div class="k-abschnitt" data-ab="normal"><h2>${symbol("route")}${esc(T("Wo erreichbar"))}</h2><div class="karte">${erreichbarHtml(w)}</div></div>`
    + `<div class="k-abschnitt k-roh" data-ab="normal"><details${App.stufe === "weit" ? " open" : ""}><summary>${esc(T("JSON-Schema der Eingabe"))}</summary><pre class="k-pre"><code>${esc(JSON.stringify(d.schema, null, 2))}</code></pre></details></div>`;
}
function zeichneDetail() {
  const ort = $("detail");
  if (ort) ort.innerHTML = detailHtml();
}
async function ladeDetail(id, neu) {
  if (!neu && details.has(id) && !details.get(id).fehler) return;
  details.delete(id);
  zeichneDetail();
  try {
    const d = await rufen("werkzeug", { name: id });
    if (!d || !d.eingabefelder) throw new Error(T("Die Antwort ist unvollständig."));
    details.set(id, d);
  } catch (e) { details.set(id, { fehler: fehlertext(e) }); }
  if (S.werkzeug === id) zeichneDetail();
}
function waehleWerkzeug(id) {
  S.werkzeug = id; S.pane = "detail";
  const ort = $("haupt").querySelector(".k-kasten");
  if (ort) ort.dataset.pane = S.pane;
  zeichneListe(); zeichneDetail();
  ladeDetail(id);
  if (window.matchMedia("(max-width: 819px)").matches) window.scrollTo?.({ top: 0 });
}
async function probieren() {
  const w = werkzeugVon(S.werkzeug), d = w && details.get(w.id);
  if (!w || !d || !w.ausprobierbar) return;
  const { args, fehler } = argumente(d.eingabefelder || [], eingaben.get(w.id) || {}, true);
  feldFehler.set(w.id, fehler);
  if (Object.keys(fehler).length) { probe.delete(w.id); zeichneDetail(); const el = $("detail").querySelector(".k-feld.fehler :where(input,select,textarea)"); if (el) el.focus(); return; }
  probe.set(w.id, { laeuft: true }); zeichneDetail();
  try {
    const r = await rufen("ausprobieren", { werkzeug: w.id, arguments: args });
    probe.set(w.id, r && r.ok ? r : { fehler: (r && r.error) || T("Der Aufruf hat nicht geklappt.") });
  } catch (e) { probe.set(w.id, { fehler: fehlertext(e) }); }
  if (S.werkzeug === w.id) { zeichneDetail(); const el = $("ergebnis"); if (el && el.scrollIntoView) el.scrollIntoView({ block: "nearest", behavior: "smooth" }); }
}

// ── Apps ───────────────────────────────────────────────────────────────────────────────────────
function appsHtml() {
  if (!daten.apps.length) return `<div class="gruppe">${zustand({ symbol: "layout-grid", ton: "grau", titel: "Keine Apps", text: "Der Hub liefert gerade keine Werkzeuge mit Oberfläche." })}</div>`;
  // Eine Ansicht je Größe (Entscheidung 507): kompakt sechs Apps, der Rest als Hinweis; normal und weit alle
  const n = App.anzahl({ kompakt: 6 }), rest = daten.apps.length - Math.min(daten.apps.length, n);
  const nachKategorie = new Map();
  for (const a of daten.apps.slice(0, n)) { const k = a.kategorie || "Weitere"; if (!nachKategorie.has(k)) nachKategorie.set(k, []); nachKategorie.get(k).push(a); }
  return [...nachKategorie].map(([k, liste]) => `<section class="abschnitt"><h2>${symbol("layout-grid")}${esc(T(k))}<span class="anzahl">${liste.length}</span></h2><div class="raster">${liste.map(appKarteHtml).join("")}</div></section>`).join("")
    + (rest > 0 ? weitereZeile(rest) : "");
}
function appKarteHtml(a) {
  const chips = a.werkzeuge.map((id) => `<button type="button" class="chip" data-springe="${esc(id)}" title="${esc(T("Im Werkzeugkasten zeigen"))}">${esc(id.split(".")[1] || id)}</button>`).join("");
  return `<article class="karte k-appkarte"><div class="k-appkopf"><span class="kachel app gross" style="--h:${Number(a.ton) || 230}">${symbol(a.symbol)}</span>`
    + `<span class="zeile-text"><span class="zeile-titel">${esc(sprachTitel(a))}</span><span class="zeile-unter">${esc(sprachUntertitel(a))}</span></span></div>`
    + `<dl class="kv"><dt>${esc(T("Oberfläche"))}</dt><dd><code>${esc(a.uri)}</code></dd><dt>Plugin</dt><dd><code>${esc(a.plugin)}</code></dd><dt>${esc(T("Werkzeuge"))}</dt><dd><span class="k-chips">${chips}</span></dd></dl>`
    + (a.oeffnen ? `<div class="knoepfe"><button type="button" class="zweit klein" data-oeffnen="${esc(a.oeffnen)}">${symbol("square-arrow-out-up-right")}${esc(T("In FYOS öffnen"))}</button></div>` : "")
    + `</article>`;
}

// ── Protokolle, Zugänge, Aufrufer ──────────────────────────────────────────────────────────────
function versionen(liste, modern) {
  if (!liste || !liste.length) return `<span class="mut">${esc(T("keine MCP-Versionen (kein Handshake)"))}</span>`;
  return [...liste].sort().reverse().map((v) => `<span class="marke${modern.includes(v) ? " akz" : ""}">${esc(v)}</span>`).join("");
}
function zugangHtml(z) {
  const sym = z.name.startsWith("Hub") ? "server" : z.name === "REST" ? "route" : "monitor";
  return `<article class="karte k-zugang"><div class="k-zugang-kopf">${kachel(sym, "akz", "gross")}<span class="zeile-text"><span class="zeile-titel">${esc(z.name)}</span><span class="zeile-unter"><code>${esc(z.pfad)}</code></span></span></div>`
    + `<p>${esc(z.wer)} · ${esc(z.art)}${z.werkzeuge != null ? esc(T(" · {0} freigegeben", zahlWort(z.werkzeuge, "Werkzeug", "werkzeuge"))) : ""}</p>`
    + (z.protokolle.length ? `<div class="k-versionen">${versionen(z.protokolle, daten.hub.modern)}</div>` : "") + `</article>`;
}
function flaecheReihe(f) {
  const weg = WEG[f.weg] || WEG.mcp;
  const prot = Object.entries(f.protokolle || {}).map(([v, n]) => `<span class="marke${daten.hub.modern.includes(v) ? " akz" : ""}" title="${esc(T("{0} Anfragen mit dieser Version", n))}">${esc(v)}</span>`).join("");
  return `<li class="zeile"><span class="kachel klein grau">${symbol(weg.symbol)}</span><span class="zeile-text"><span class="zeile-titel"><code>${esc(f.aufrufer)}</code></span>`
    + `<span class="zeile-unter">${esc(weg.text)} · ${esc(App.zeit.vor(f.zuletzt))}</span>${prot ? `<span class="k-versionen" style="margin-top:4px">${prot}</span>` : ""}</span>`
    + `<span class="zeile-ende">${App.zahl(f.anzahl, 0)}×</span></li>`;
}
/** Was die kurze Ansicht je Aufrufer spart (ansicht.messung, 7 Tage): Zeichen voll gegen kurz + nachgeholt. */
function messungAbschnitt() {
  const m = daten.ansicht_messung;
  if (!m) return "";
  const zahl = (n) => n >= 10000 ? `${App.zahl(n / 1000, 0)} k` : App.zahl(n, 0);
  const reihe = (z) => {
    const p = z.gespart_prozent;
    const ton = p == null ? "grau" : p >= 50 ? "gut" : p >= 10 ? "akz" : "grau";
    return `<li class="zeile"><span class="kachel klein ${ton}">${symbol(z.aufrufer === "alle" ? "layers" : "bot")}</span>`
      + `<span class="zeile-text"><span class="zeile-titel">${esc(z.aufrufer === "alle" ? T("Alle Modelle") : z.aufrufer)}</span>`
      + `<span class="zeile-unter">${esc(T("{0} Aufrufe, {1} gekürzt · {2} → {3} Zeichen", App.zahl(z.aufrufe, 0), App.zahl(z.gekuerzt, 0), zahl(z.zeichen_voll), zahl(z.zeichen_kurz)))}`
      + `${z.mehr ? esc(T(" · {0}× nachgeholt ({1})", App.zahl(z.mehr, 0), zahl(z.zeichen_nachgeholt))) : ""}</span></span>`
      + `<span class="zeile-ende">${p == null ? "" : marke(T("{0} % gespart", App.zahl(p, 0)), ton === "grau" ? "" : ton, "trending-down")}</span></li>`;
  };
  const zeilen = m.aufrufer || [];
  return `<section class="abschnitt" data-ab="normal"><h2>${symbol("filter")}${esc(T("Kurze Ansicht — Ersparnis {0} Tage", m.tage))}</h2>`
    + (zeilen.length
      ? `<div class="gruppe"><ul class="zeilen">${[m.gesamt, ...zeilen].map(reihe).join("")}</ul></div>`
      : `<div class="gruppe">${zustand({ symbol: "filter", ton: "grau", klein: true, titel: "Noch nichts gemessen", text: "Sobald ein Modell ein Werkzeug über den Hub ruft, steht es hier." })}</div>`)
    + `<p class="fuss" style="text-align:left;margin:8px 2px 0">${esc(m.hinweis)}</p></section>`;
}
function protokolleHtml() {
  const h = daten.hub;
  const modernText = h.modern.length ? "Der Hub spricht beide Zeitalter: den Handshake (initialize) und die zustandslose Fassung 2026-07-28 (server/discover)." : "Dieses SDK kennt nur den Handshake; 2026-07-28 spricht erst mcp 2.x.";
  return `<section class="abschnitt"><h2>${symbol("waypoints")}${esc(T("Protokollversionen"))}</h2>`
    + `<div class="hinweis info" data-ab="normal">${symbol("info")}<span>${esc(T(modernText))}</span></div>`
    + `<dl class="kv" style="margin:14px 2px 0"><dt>Hub</dt><dd>${esc(T("Version {0}, gestartet {1}", h.version, App.zeit.vor(h.gestartet)))}</dd><dt>SDK</dt><dd><code>${esc(h.sdk)}</code></dd>`
    + `<dt>Handshake</dt><dd><span class="k-versionen">${versionen(h.handshake, h.modern)}</span></dd>`
    + `<dt>${esc(T("Zustandslos"))}</dt><dd><span class="k-versionen">${versionen(h.modern, h.modern)}</span></dd>`
    + `</dl></section>`
    + inspectorAbschnitt()
    + messungAbschnitt()
    + `<section class="abschnitt"><h2>${symbol("plug")}${esc(T("Zugänge"))}<span class="anzahl">${daten.zugaenge.length}</span></h2><div class="raster">${daten.zugaenge.map(zugangHtml).join("")}</div></section>`
    + `<section class="abschnitt"><h2>${symbol("history")}${esc(T("Zuletzt gesehen"))}<span class="anzahl">${daten.flaechen.length}</span></h2>`
    + (daten.flaechen.length
      ? `<div class="gruppe">${kurzeListe(daten.flaechen, flaecheReihe)}</div>`
      : `<div class="gruppe">${zustand({ symbol: "unplug", ton: "grau", klein: true, titel: "Noch niemand seit dem Start", text: "Sobald ein Client den Hub anspricht, steht er hier." })}</div>`)
    + `<p class="fuss" style="text-align:left;margin:8px 2px 0" data-ab="normal">${esc(daten.flaechen_hinweis)}</p></section>`
    + `<section class="abschnitt"><h2>${symbol("app-window")}${esc(T("Oberflächen (ui://)"))}<span class="anzahl">${daten.ressourcen.length}</span></h2>`
    + (daten.ressourcen.length
      ? `<div class="gruppe">${kurzeListe(daten.ressourcen, (r) => `<li class="zeile"><span class="kachel klein grau">${symbol("app-window")}</span><span class="zeile-text"><span class="zeile-titel"><code>${esc(r.uri)}</code></span><span class="zeile-unter">${esc(r.name)} · ${esc(T("Plugin {0}", r.plugin))}</span></span><span class="zeile-ende"><span class="marke">${esc(String(r.mime).replace("text/html;profile=", ""))}</span></span></li>`)}</div>`
      : `<div class="gruppe">${zustand({ symbol: "app-window", ton: "grau", klein: true, titel: "Keine Oberflächen", text: "Kein Plugin liefert eine ui://-Ressource." })}</div>`)
    + `</section>`;
}

// ── Laden ──────────────────────────────────────────────────────────────────────────────────────
function datenUebernehmen(d) {
  if (!d || !Array.isArray(d.plugins) || !Array.isArray(d.werkzeuge)) return false;
  daten = d; standZeit = Date.now(); veraltet = false;
  if (S.plugin && !pluginVon(S.plugin)) S.plugin = "";
  if (S.werkzeug && !werkzeugVon(S.werkzeug)) S.werkzeug = "";
  if (vorwahl && werkzeugVon(vorwahl)) {
    const w = werkzeugVon(vorwahl);
    S.werkzeug = w.id; S.plugin = w.plugin; S.pane = "detail"; S.ansicht = "kasten";
    vorwahl = "";
    ladeDetail(w.id);
  }
  zeichnen();
  return true;
}
function ladeFehler(text) {
  if (!daten) {
    $("reiter").hidden = true;
    $("haupt").innerHTML = `<div class="gruppe">${zustand({ symbol: "wifi-off", ton: "schlecht", titel: "Der Werkzeugkasten ist nicht erreichbar", text, knopf: { text: "Erneut versuchen", aktion: "neu", symbol: "refresh-cw" } })}</div>`;
    satz("Keine Verbindung", "schlecht");
  } else { veraltet = true; zeichneSatz(); melden(T("Das Aktualisieren hat nicht geklappt: {0}", text)); }
}
async function neu(frisch) {
  $("neu").disabled = true;
  try {
    if (!datenUebernehmen(await rufen("uebersicht", frisch ? { frisch: true, voll: true } : { voll: true }))) throw new Error(T("Die Antwort ist unvollständig."));
    melden("");
  } catch (e) { ladeFehler(fehlertext(e)); }
  $("neu").disabled = false;
}
$("neu").addEventListener("click", () => neu(true));
App.bei("neu", () => neu(true));
App.bei("zuruecksetzen", () => { S.suche = ""; S.filter = "alle"; zeichnen(); });
App.bei("probieren", probieren);
App.bei("detail-neu", () => { if (S.werkzeug) ladeDetail(S.werkzeug, true); });
// Eine Ansicht je Größe (Entscheidung 507): bei jedem Stufenwechsel neu zeichnen. Solange in einem Feld getippt wird,
// wartet das Zeichnen, sonst verliert die Eingabe den Fokus; beim Verlassen des Feldes wird nachgeholt.
let stufeWartet = false;
function stufeZeichnen() {
  if (!daten) return;
  const a = document.activeElement;
  if (a && /^(INPUT|TEXTAREA|SELECT)$/.test(a.tagName)) { stufeWartet = true; return; }
  stufeWartet = false;
  zeichnen();
}
window.addEventListener("app-stufe", stufeZeichnen);
document.addEventListener("focusout", () => { if (stufeWartet) setTimeout(stufeZeichnen, 0); });

// ── Bedienung ──────────────────────────────────────────────────────────────────────────────────
document.addEventListener("click", (ev) => {
  const t = ev.target.closest && ev.target.closest("[data-ansicht],[data-plugin],[data-werkzeug],[data-filter],[data-zurueck],[data-mehr],[data-oeffnen],[data-springe]");
  if (!t || t.disabled) return;
  const d = t.dataset;
  if (d.ansicht) { S.ansicht = d.ansicht; zeichnen(); }
  else if (d.plugin !== undefined) { S.plugin = d.plugin; S.zeilen = SEITE; S.pane = "werkzeuge"; zeichnen(); }
  else if (d.werkzeug) waehleWerkzeug(d.werkzeug);
  else if (d.filter) { S.filter = d.filter; S.zeilen = SEITE; zeichnen(); }
  else if (d.zurueck) { S.pane = d.zurueck; zeichnen(); }
  else if (d.mehr) { S.zeilen += SEITE; zeichneListe(); }
  else if (d.oeffnen) oeffnen(d.oeffnen);
  else if (d.springe) {
    const w = werkzeugVon(d.springe);
    S.ansicht = "kasten"; if (w) S.plugin = w.plugin; S.suche = ""; S.filter = "alle"; S.zeilen = SEITE;
    zeichnen(); waehleWerkzeug(d.springe);
  }
});
document.addEventListener("input", (ev) => {
  const t = ev.target;
  if (t.id === "suche") { S.suche = t.value; S.zeilen = SEITE; zeichneListe(); return; }
  if (t.dataset && t.dataset.feld && S.werkzeug) {
    const werte = eingaben.get(S.werkzeug) || {};
    werte[t.dataset.feld] = t.value; eingaben.set(S.werkzeug, werte);
    const fe = feldFehler.get(S.werkzeug);
    if (fe && fe[t.dataset.feld]) { delete fe[t.dataset.feld]; t.closest(".k-feld").classList.remove("fehler"); }
    const w = werkzeugVon(S.werkzeug), d = w && details.get(w.id), pre = $("aufruf");
    if (pre && d && d.eingabefelder) pre.innerHTML = `<code>${esc(aufrufText(w, d))}</code>`;
  }
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Enter" && ev.target.matches && ev.target.matches("input[data-feld]")) { ev.preventDefault(); probieren(); }
});

// ── Host ───────────────────────────────────────────────────────────────────────────────────────
App.auf("ui/notifications/tool-result", (r) => {
  bekommen = true;
  if (r && r.isError) { ladeFehler(fehlertext(((r.content || [])[0] || {}).text)); return; }
  const d = App.daten(r);
  if (d && d.eingabefelder && d.id) { vorwahl = d.id; details.set(d.id, d); neu(false); return; } // geöffnet über mcp__werkzeug
  if (d && d.knapp) { neu(false); return; } // knappe Ansicht (KI-Aufruf): ohne Werkzeugkatalog, die Oberfläche holt die Vollform
  if (!datenUebernehmen(d) && !daten) neu(false);
});
App.start("fyos-mcp").then(() => setTimeout(() => { if (!bekommen) neu(false); }, 1500)).catch(() => {});
</script>
