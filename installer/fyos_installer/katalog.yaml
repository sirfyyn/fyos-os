# Katalog der FYOS-Bausteine. Schema und Prüfung: katalog.py.
# Bilder: Dateinamen unter bilder/, Namensschema <id>-<n>.svg (später gern .png, der Installer nimmt, was da ist).
# Plugin-Pakete bringen eine eigene fyos-katalog.yaml mit demselben Aufbau mit.
# `reife` (optional): die Stufe 1 bis 3, die der Baustein in einer Schicht erreicht (gedaechtnis, agent, takte,
# oberflaeche; Leiter und Sätze in reife.py). Ohne Angabe bleibt die Schicht auf Stufe 1, das leisten Kern und Agent.
version: 1
plugin_quelle_beispiel: https://git.example.com/fyos
bausteine:
  - id: kern
    titel: FYOS-Oberfläche und Hub
    kurz: Der Desktop im Browser mit Fenstern, Dock und dem Hub als Werkzeugkasten.
    was_daraus_wird: |
      Du öffnest eine Adresse im Browser und siehst einen eigenen Desktop mit Fenstern, Dock, Menüleiste und Kacheln.
      Jede Fläche ist eine kleine App, die der Hub bereitstellt; neue Apps aus Plugins erscheinen dort ohne weiteren Aufwand.
      Der Hub ist der gemeinsame Werkzeugkasten: Er bündelt alle Fähigkeiten als Werkzeuge, die du und der Agent benutzen können.
      Alles läuft auf deinem eigenen Rechner, ohne Anmeldung bei einem Fremddienst.
      Mit dem Kern allein hast du eine funktionierende, aber noch leere Arbeitsfläche, auf der du später Bausteine ergänzt.
    en:
      titel: FYOS interface and Hub
      kurz: The desktop in the browser with windows, dock and the Hub as the toolbox.
      was_daraus_wird: |
        You open an address in the browser and see your own desktop with windows, dock, menu bar and tiles.
        Every surface is a small app provided by the Hub; new apps from plugins appear there without further effort.
        The Hub is the shared toolbox: it bundles all capabilities as tools that you and the agent can use.
        Everything runs on your own computer, without signing in to a third-party service.
        With the core alone you have a working but still empty workspace, to which you add building blocks later.
      voraussetzungen:
        - Docker with Compose (for the Docker Compose target) or a Kubernetes cluster
        - A current browser
      felder:
        port: { titel: Port, beschreibung: Port on this computer under which FYOS should be reachable }
        oeffentliche_url: { titel: Public address, beschreibung: Address at which you open FYOS in the browser }
    bilder: [kern-1.svg, kern-2.svg]
    art: kern
    pflicht: true
    abhaengig_von: []
    voraussetzungen:
      - Docker mit Compose (für das Ziel Docker Compose) oder ein Kubernetes-Cluster
      - Ein aktueller Browser
    quelle: null
    hub_plugins:
      - { name: echo, enabled: false }
      - { name: math, enabled: false }
      - { name: audit }
      - { name: event_bus_publisher }
      - { name: skills }
      - { name: werkstatt }
      - { name: mcp }
      - { name: shell }
      - { name: os }
      - { name: dateien }
      - { name: suche }
      - { name: vorgaenge }
      - { name: itsm }
      - { name: posteingang }
      - { name: termine }
    konfiguration:
      - name: port
        titel: Port
        typ: zahl
        beschreibung: Port auf diesem Rechner, unter dem FYOS erreichbar sein soll
        standard: 8080
        pflicht: true
        umgebung: FYOS_PORT
      - name: oeffentliche_url
        titel: Öffentliche Adresse
        typ: url
        beschreibung: Adresse, unter der du FYOS im Browser öffnest
        standard: http://localhost:8080
        pflicht: true
        umgebung: FYOS_OEFFENTLICH_URL

  - id: agent
    titel: Agent-Grundlage
    kurz: Ein persönlicher Agent im Chat, der bei Schwerem zuerst fragt.
    was_daraus_wird: |
      Neben dem Desktop öffnet sich ein Chatfenster, in dem du mit deinem Agenten sprichst; Name, Wesen und Sprache bestimmst du bei der Einrichtung.
      Der Agent findet und benutzt alle Werkzeuge des Hubs, sobald Bausteine welche mitbringen.
      Was er nicht allein entscheiden darf, etwa Löschen, Geld oder Zugangsdaten, legt er dir als Freigabe-Karte vor, die du mit einem Klick bestätigst oder ablehnst.
      Kleines erledigt er selbst und meldet es knapp, ohne dich mit Nachrichten zu überhäufen.
      Ruhezeiten und ein Tagesbudget für Meldungen sind eingebaut.
    en:
      titel: Agent foundation
      kurz: A personal agent in the chat that asks first when something is serious.
      was_daraus_wird: |
        Next to the desktop a chat window opens in which you talk to your agent; you set its name, character and language during setup.
        The agent finds and uses all tools of the Hub as soon as building blocks bring some.
        What it may not decide alone, such as deleting, money or credentials, it puts before you as an approval card that you confirm or reject with one click.
        Small things it does itself and reports briefly, without flooding you with messages.
        Quiet hours and a daily budget for messages are built in.
      voraussetzungen:
        - A language model with an OpenAI-compatible interface (local or hosted)
    bilder: [agent-1.svg]
    art: agent
    pflicht: true
    abhaengig_von: [kern]
    voraussetzungen:
      - Ein Sprachmodell mit OpenAI-kompatibler Schnittstelle (lokal oder gehostet)
    quelle: null
    konfiguration: []

  - id: beispiel_app
    titel: Beispiel-App
    kurz: Eine kleine Demo-App, die zeigt, wie Plugins eigene Oberflächen liefern.
    was_daraus_wird: |
      Im Desktop erscheint ein zusätzliches Fenster mit einer einfachen Beispielfläche.
      Sie zeigt, wie ein Plugin über den Hub eine eigene Oberfläche bekommt, die die Shell ohne zusätzlichen Code einblendet.
      Der Agent kann die Beispielwerkzeuge aufrufen und das Ergebnis im Chat zeigen.
      So probierst du aus, wie Werkzeuge, Fenster und Chat zusammenspielen, bevor du echte Bausteine wählst.
      Gedacht ist die App auch als Vorlage für eigene Plugins.
    en:
      titel: Example app
      kurz: A small demo app that shows how plugins bring their own interfaces.
      was_daraus_wird: |
        An additional window with a simple example surface appears on the desktop.
        It shows how a plugin gets its own interface through the Hub, which the shell displays without extra code.
        The agent can call the example tools and show the result in the chat.
        This lets you try how tools, windows and chat work together before you choose real building blocks.
        The app is also meant as a template for your own plugins.
    bilder: [beispiel_app-1.svg]
    art: plugin
    pflicht: false
    abhaengig_von: [kern]
    voraussetzungen: []
    quelle: null
    reife: { oberflaeche: 2, agent: 2 }
    hub_plugins:
      - { name: beispiel_app }
    konfiguration: []

  - id: finanzen
    titel: Finanzen mit MoneyMoney
    kurz: Kontostände, Umsätze und Monatsplan als App; der Agent kennt deine Zahlen.
    was_daraus_wird: |
      Du bekommst eine Finanz-App mit Kontoständen, einer Umsatzliste und einem Monatsplan, in dem bezahlte und ausgesetzte Posten abgehakt werden.
      Die Daten kommen aus MoneyMoney auf deinem Mac, der sie ein- bis zweimal täglich an deine Installation schickt.
      Der Agent beantwortet Fragen wie »Was ist diesen Monat noch offen?« oder »Wofür ging diese Woche am meisten weg?«.
      IBAN, Referenz und Notizen gibt er nicht weiter, und die Zahlen bleiben auf deinem Rechner.
      Überweisungen löst nichts davon aus; es wird nur gelesen.
    en:
      titel: Finances with MoneyMoney
      kurz: Balances, transactions and monthly plan as an app; the agent knows your numbers.
      was_daraus_wird: |
        You get a finance app with account balances, a transaction list and a monthly plan in which paid and paused items are ticked off.
        The data comes from MoneyMoney on your Mac, which sends it to your installation once or twice a day.
        The agent answers questions like »What is still open this month?« or »What did I spend the most on this week?«.
        It does not pass on IBAN, reference or notes, and the numbers stay on your computer.
        None of this triggers transfers; it only reads.
      voraussetzungen:
        - macOS with MoneyMoney for the export
        - The data service for the monthly plan and webhooks must be reachable (see the plugin's README)
      felder:
        finanzen_url: { titel: Address of the monthly plan service, beschreibung: Address of the monthly plan service (leave empty for the plugin's default) }
        life_url: { titel: Address of the MoneyMoney service, beschreibung: Address of the service that receives the MoneyMoney data }
        auth_header: { titel: Access header, beschreibung: "Header »Name: Value« for internal calls to both services" }
    bilder: [finanzen-1.svg]
    art: plugin
    pflicht: false
    abhaengig_von: [kern, agent]
    voraussetzungen:
      - macOS mit MoneyMoney für den Export
      - Der Datendienst für Monatsplan und Webhooks muss erreichbar sein (siehe README des Plugins)
    quelle: { paket: fyos-plugin-finanzen, repo: fyos-plugin-finanzen }
    reife: { oberflaeche: 2, agent: 2, gedaechtnis: 2 }
    konfiguration:
      - name: finanzen_url
        titel: Adresse des Monatsplan-Dienstes
        typ: url
        beschreibung: Adresse des Monatsplan-Dienstes (leer lassen für die Vorgabe des Plugins)
        standard: ""
        pflicht: false
        umgebung: FYOS_FINANZEN_URL
      - name: life_url
        titel: Adresse des MoneyMoney-Dienstes
        typ: url
        beschreibung: Adresse des Dienstes, der die MoneyMoney-Daten annimmt
        standard: ""
        pflicht: false
        umgebung: FYOS_FINANZEN_LIFE_URL
      - name: auth_header
        titel: Zugangs-Kopfzeile
        typ: geheim
        beschreibung: "Kopfzeile »Name: Wert« für interne Aufrufe an die beiden Dienste"
        standard: ""
        pflicht: false
        umgebung: FYOS_FINANZEN_AUTH_HEADER

  - id: haus
    titel: Haus, Licht und Anwesenheit
    kurz: Licht, Szenen, Anwesenheit und Kameras über Home Assistant.
    was_daraus_wird: |
      Du bekommst einen Raumplan mit deinen Lichtern, Szenen und Favoriten, die du anklickst oder dem Agenten zurufst.
      Der Agent versteht Sätze wie »Licht an« und schaltet im Raum, in dem du gerade bist, sofern die Anwesenheit bekannt ist; sonst fragt er nach.
      Kamerabilder und Bewegungsmeldungen erscheinen als Kacheln, ohne dass Aufnahmen die Installation verlassen.
      Als Anbindung dient dein vorhandenes Home Assistant.
      Wetter und Raumbelegung liegen als Werkzeuge bereit, auf die auch andere Apps zugreifen können.
    en:
      titel: Home, lights and presence
      kurz: Lights, scenes, presence and cameras through Home Assistant.
      was_daraus_wird: |
        You get a floor plan with your lights, scenes and favourites, which you click or call out to the agent.
        The agent understands sentences like »lights on« and switches in the room you are in, if presence is known; otherwise it asks.
        Camera images and motion events appear as tiles, without recordings leaving the installation.
        Your existing Home Assistant serves as the connection.
        Weather and room occupancy are available as tools that other apps can use too.
      voraussetzungen:
        - A running Home Assistant installation that the Hub can reach
        - A long-lived access token from Home Assistant
        - Optionally Frigate for cameras
      felder:
        ha_url: { titel: Address of Home Assistant, beschreibung: Address of Home Assistant }
        ha_token: { titel: Access token, beschreibung: Long-lived access token (profile in Home Assistant, section Security) }
    bilder: [haus-1.svg]
    art: plugin
    pflicht: false
    abhaengig_von: [kern, agent]
    voraussetzungen:
      - Eine laufende Home-Assistant-Installation, die der Hub erreicht
      - Ein Langzeit-Zugriffstoken aus Home Assistant
      - Für Kameras optional Frigate
    quelle: { paket: fyos-plugin-haus, repo: fyos-plugin-haus }
    reife: { oberflaeche: 2, agent: 2, gedaechtnis: 2 }
    konfiguration:
      - name: ha_url
        titel: Adresse von Home Assistant
        typ: url
        beschreibung: Adresse von Home Assistant
        standard: http://homeassistant.local:8123
        pflicht: true
        umgebung: FYOS_HAUS_HA_URL
      - name: ha_token
        titel: Zugriffstoken
        typ: geheim
        beschreibung: Langzeit-Zugriffstoken (Profil in Home Assistant, Abschnitt Sicherheit)
        standard: ""
        pflicht: false
        umgebung: FYOS_HAUS_HA_TOKEN

  - id: konten
    titel: Persönliche Konten und Medien
    kurz: Passwort-Tresor, Mail, Kalender, Fotos, Medien und Bestellungen an einem Ort.
    was_daraus_wird: |
      Auf dem Desktop erscheinen Flächen für Mail, Kalender, Fotos, Medien und Bestellungen, die deine bestehenden Konten anzapfen.
      Der Agent trägt dann Termine ein, fasst Mails zusammen oder sucht Fotos, wenn du ihn darum bittest.
      Ein Konten-Überblick zeigt, welche Verbindung gerade gültig ist und wo eine Anmeldung erneuert werden muss.
      Zugangsdaten liegen im Tresor und im Hub, nicht im Chatverlauf.
      Jede Verbindung schaltest du einzeln ein; ohne Eintrag bleibt sie unberührt.
    en:
      titel: Personal accounts and media
      kurz: Password vault, mail, calendar, photos, media and orders in one place.
      was_daraus_wird: |
        Surfaces for mail, calendar, photos, media and orders appear on the desktop and tap into your existing accounts.
        The agent then adds appointments, summarises mails or searches photos when you ask it to.
        An accounts overview shows which connection is currently valid and where a sign-in must be renewed.
        Credentials live in the vault and in the Hub, not in the chat history.
        You switch on each connection separately; without an entry it stays untouched.
      voraussetzungen:
        - Access to the services you want to connect (mail, calendar, photos)
        - A password vault or the willingness to create one
      felder:
        tresor_url: { titel: Address of the vault, beschreibung: Address of your password vault }
        tresor_token: { titel: Vault token, beschreibung: Access token for the vault }
    bilder: [konten-1.svg]
    art: plugin
    pflicht: false
    abhaengig_von: [kern, agent]
    voraussetzungen:
      - Zugänge zu den Diensten, die du verbinden willst (Mail, Kalender, Fotos)
      - Ein Passwort-Tresor oder die Bereitschaft, einen anzulegen
    quelle: { paket: fyos-plugin-konten, repo: fyos-plugin-konten }
    reife: { oberflaeche: 2, agent: 2, gedaechtnis: 2 }
    konfiguration:
      - name: tresor_url
        titel: Adresse des Tresors
        typ: url
        beschreibung: Adresse deines Passwort-Tresors
        standard: ""
        pflicht: false
        umgebung: FYOS_KONTEN_TRESOR_URL
      - name: tresor_token
        titel: Tresor-Token
        typ: geheim
        beschreibung: Zugriffstoken für den Tresor
        standard: ""
        pflicht: false
        umgebung: FYOS_KONTEN_TRESOR_TOKEN

  - id: kalender
    titel: Kalender mit CalDAV und ICS-Abo
    kurz: Deine Termine ohne eigenen Dienst, per CalDAV mit App-Passwort oder als ICS-Abo.
    was_daraus_wird: |
      Der Agent kennt deine Termine: Er sagt dir, was heute und in den nächsten Tagen ansteht, und trägt auf Wunsch einen neuen Termin ein.
      Verbunden wird dein Kalender über CalDAV mit einem App-Passwort, etwa bei iCloud, Nextcloud oder Fastmail.
      Weitere Kalender, zum Beispiel die geheime Adresse aus Google oder Outlook oder ein Feiertagskalender, kommen als ICS-Abo dazu und werden nur gelesen.
      Wiederkehrende Termine, Ausnahmen und Zeitzonen werden richtig aufgelöst.
      Ändern oder Löschen gibt es bewusst nicht; ein Termin entsteht nur, wenn du den Agenten darum bittest.
      Ist der Leitstand dabei, zeigt seine Zentrale den Tag, und ohne Kalender sagt sie ehrlich »Kalender nicht eingerichtet«.
    en:
      titel: Calendar with CalDAV and ICS subscription
      kurz: Your appointments without a service of your own, via CalDAV with an app password or as an ICS subscription.
      was_daraus_wird: |
        The agent knows your appointments: it tells you what is due today and in the next days, and adds a new appointment on request.
        Your calendar is connected via CalDAV with an app password, for example at iCloud, Nextcloud or Fastmail.
        More calendars, for example the secret address from Google or Outlook or a holiday calendar, are added as ICS subscriptions and only read.
        Recurring appointments, exceptions and time zones are resolved correctly.
        Changing or deleting is deliberately not offered; an appointment is only created when you ask the agent to.
        If the control room is included, its control center shows the day, and without a calendar it honestly says »Calendar not set up«.
      voraussetzungen:
        - A calendar with CalDAV access and app password, or the address of an ICS subscription
        - A Hub from version 0.1.1 (appointment source for the control room); an older Hub offers the plugin's tools, but no appointments in the control center
        - The package comes from the package index (FYOS_PAKETINDEX) or the plugin source (FYOS_PLUGIN_QUELLE), not from PyPI
      felder:
        url: { titel: Calendar address, beschreibung: "CalDAV address of the provider, such as https://caldav.icloud.com, or the address of an ICS subscription (then leave user name and password empty); more accounts are described in the plugin's README" }
        nutzer: { titel: User name, beschreibung: User name of the CalDAV account (at iCloud the Apple ID address) }
        passwort: { titel: App password, beschreibung: "App password of the calendar, not the account's main password (create it in the provider's security settings)" }
    bilder: [kalender-1.svg]
    art: plugin
    pflicht: false
    abhaengig_von: [kern, agent]
    voraussetzungen:
      - Ein Kalender mit CalDAV-Zugang und App-Passwort oder die Adresse eines ICS-Abos
      - Ein Hub ab Version 0.1.1 (Termin-Quelle für den Leitstand); ein älterer Hub bietet die Werkzeuge des Plugins, aber keine Termine in der Zentrale
      - Das Paket kommt aus dem Paketindex (FYOS_PAKETINDEX) oder der Plugin-Quelle (FYOS_PLUGIN_QUELLE), nicht von PyPI
    quelle: { paket: fyos-plugin-kalender, repo: fyos-plugin-kalender }
    reife: { agent: 2, gedaechtnis: 2 }
    konfiguration:
      - name: url
        titel: Adresse des Kalenders
        typ: url
        beschreibung: CalDAV-Adresse des Anbieters, etwa https://caldav.icloud.com, oder die Adresse eines ICS-Abos (dann Benutzername und Passwort leer lassen); weitere Konten stehen im README des Plugins
        standard: ""
        pflicht: false
        umgebung: FYOS_KALENDER_URL
      - name: nutzer
        titel: Benutzername
        typ: text
        beschreibung: Benutzername des CalDAV-Kontos (bei iCloud die Apple-ID-Adresse)
        standard: ""
        pflicht: false
        umgebung: FYOS_KALENDER_NUTZER
      - name: passwort
        titel: App-Passwort
        typ: geheim
        beschreibung: App-Passwort des Kalenders, nicht das Hauptpasswort des Kontos (beim Anbieter in den Sicherheitseinstellungen anlegen)
        standard: ""
        pflicht: false
        umgebung: FYOS_KALENDER_PASSWORT

  - id: mail
    titel: Mail lesen per IMAP
    kurz: Dein Posteingang ohne eigenen Dienst, per IMAP mit App-Passwort, nur lesend.
    was_daraus_wird: |
      Der Agent kennt deinen Posteingang: Er sagt dir, was ungelesen ist, sucht nach Absendern oder Stichwörtern und liest eine einzelne Mail vor.
      Verbunden wird dein Postfach über IMAP mit einem App-Passwort, etwa bei Gmail, iCloud, Fastmail, Outlook oder einem eigenen Mailserver; weitere Konten trägst du nach der Anleitung im README des Plugins ein.
      Es wird nur gelesen: Senden, Antworten, Löschen oder Verschieben gibt es bewusst nicht, und auch der Gelesen-Status bleibt, wie er war.
      Mailtext gilt dem Agenten als fremder Inhalt, den er berichtet und dem er nicht folgt.
      Ist der Leitstand dabei, wacht er über neue Mails, und ohne Postfach sagt er ehrlich »Mail nicht eingerichtet«.
    en:
      titel: Read mail via IMAP
      kurz: Your inbox without a service of your own, via IMAP with an app password, read-only.
      was_daraus_wird: |
        The agent knows your inbox: it tells you what is unread, searches for senders or keywords and reads a single mail aloud.
        Your mailbox is connected via IMAP with an app password, for example at Gmail, iCloud, Fastmail, Outlook or your own mail server; you add more accounts as described in the plugin's README.
        It only reads: sending, replying, deleting or moving is deliberately not offered, and the read status stays as it was.
        To the agent, mail text is foreign content that it reports and does not follow.
        If the control room is included, it watches for new mails, and without a mailbox it honestly says »Mail not set up«.
      voraussetzungen:
        - A mailbox with IMAP access and an app password (not the account's main password)
        - A Hub from version 0.1.1 (mailbox source for the control room); an older Hub offers the plugin's tools, but no mails in the control center
        - The package comes from the package index (FYOS_PAKETINDEX) or the plugin source (FYOS_PLUGIN_QUELLE), not from PyPI
      felder:
        host: { titel: IMAP server, beschreibung: "Name of the IMAP server, such as imap.gmail.com, imap.mail.me.com or imap.fastmail.com" }
        port: { titel: Port, beschreibung: "Port of the IMAP server; 993 for encrypted connections (IMAPS), 143 with STARTTLS" }
        nutzer: { titel: User name, beschreibung: User name of the mailbox, usually the mail address }
        passwort: { titel: App password, beschreibung: "App password of the mailbox, not the account's main password (create it in the provider's security settings)" }
    bilder: [mail-1.svg]
    art: plugin
    pflicht: false
    abhaengig_von: [kern, agent]
    voraussetzungen:
      - Ein Postfach mit IMAP-Zugang und App-Passwort (nicht das Hauptpasswort des Kontos)
      - Ein Hub ab Version 0.1.1 (Postfach-Quelle für den Leitstand); ein älterer Hub bietet die Werkzeuge des Plugins, aber keine Mails in der Zentrale
      - Das Paket kommt aus dem Paketindex (FYOS_PAKETINDEX) oder der Plugin-Quelle (FYOS_PLUGIN_QUELLE), nicht von PyPI
    quelle: { paket: fyos-plugin-mail, repo: fyos-plugin-mail }
    reife: { agent: 2, gedaechtnis: 2 }
    konfiguration:
      - name: host
        titel: IMAP-Server
        typ: text
        beschreibung: Name des IMAP-Servers, etwa imap.gmail.com, imap.mail.me.com oder imap.fastmail.com
        standard: ""
        pflicht: false
        umgebung: FYOS_MAIL_HOST
      - name: port
        titel: Port
        typ: zahl
        beschreibung: Port des IMAP-Servers; 993 für verschlüsselte Verbindungen (IMAPS), 143 mit STARTTLS
        standard: 993
        pflicht: false
        umgebung: FYOS_MAIL_PORT
      - name: nutzer
        titel: Benutzername
        typ: text
        beschreibung: Benutzername des Postfachs, meist die Mail-Adresse
        standard: ""
        pflicht: false
        umgebung: FYOS_MAIL_NUTZER
      - name: passwort
        titel: App-Passwort
        typ: geheim
        beschreibung: App-Passwort des Postfachs, nicht das Hauptpasswort des Kontos (beim Anbieter in den Sicherheitseinstellungen anlegen)
        standard: ""
        pflicht: false
        umgebung: FYOS_MAIL_PASSWORT

  # Derselbe Eintrag steht in fyos-plugin-mail (fyos-katalog.yaml); ist das Paket installiert, ersetzt er diesen.
  - id: post
    titel: FYOS Post
    kurz: "Dein eigener Mail-Dienst (Listmonk): der Agent schickt dir Mitteilungen und bereitet Kampagnen vor."
    was_daraus_wird: |
      Der Agent kann dir (und anderen Abonnenten deines Listmonk) eine Mitteilung als E-Mail schicken, zum Beispiel wenn eine Aufgabe fertig ist oder etwas deine Aufmerksamkeit braucht.
      Außerdem legt er Kampagnen (Serienmails) als Entwurf an und schickt Testmails; gestartet wird eine Kampagne nie vom Agenten, das tust du in der Listmonk-Oberfläche.
      Die Grenzen stehen im Code, nicht nur in der Rolle: Mails gehen nur an vorhandene Abonnenten, Betreff und Text werden nie als Vorlage ausgewertet, und es gibt höchstens 30 Sendungen am Tag (einstellbar).
      „Angenommen“ heißt nicht „zugestellt“: scheitert der SMTP-Weg von Listmonk danach, steht der Fehler im Protokoll von Listmonk.
      Ohne Adresse von Listmonk sagt der Agent ehrlich „FYOS Post ist nicht eingerichtet“.
    en:
      titel: FYOS Post
      kurz: "Your own mail service (Listmonk): the agent sends you notices and prepares campaigns."
      was_daraus_wird: |
        The agent can send you (and other subscribers of your Listmonk) a notice as an email, for example when a task is done or something needs your attention.
        It also creates campaigns (bulk mails) as drafts and sends test mails; a campaign is never started by the agent, you do that in the Listmonk interface.
        The limits are in the code, not only in the role: mails only go to existing subscribers, subject and text are never evaluated as templates, and there are at most 30 sends per day (configurable).
        "Accepted" does not mean "delivered": if Listmonk's SMTP route fails afterwards, the error is in Listmonk's log.
        Without a Listmonk address the agent honestly says "FYOS Post is not set up".
      voraussetzungen:
        - A running Listmonk (the tools are built against the API of version 6) with a configured SMTP route and a sender address; this building block does not ship Listmonk
        - Listmonk's admin access for a one-time step, `fyos-post-einrichten --ja` (creates template, role and API access)
        - The package comes from the package index (FYOS_PAKETINDEX) or the plugin source (FYOS_PLUGIN_QUELLE), not from PyPI
      felder:
        url: { titel: Listmonk address, beschreibung: "Where the Hub reaches Listmonk, such as http://listmonk:9000 (without an address FYOS Post is not set up)" }
        link: { titel: Address of the Listmonk interface, beschreibung: "Where you open Listmonk in the browser; with it the answers show links to campaigns (empty = no links)" }
        an: { titel: Default recipient, beschreibung: "The address notices go to when none is given; it must be a subscriber in Listmonk (empty = the agent must name a recipient)" }
        zugaenge: { titel: Accesses, beschreibung: "Which Listmonk user applies to which surface, as pairs surface=user or surface=user/name; surfaces are os, chat, code, agent, dienste, * stands for all others. The default *=fyos is usually enough." }
        token_fyos: { titel: Token of the fyos access, beschreibung: "The token of the API user fyos in Listmonk (created by `fyos-post-einrichten --ja --token-datei …`); for other accesses set the variable FYOS_POST_TOKEN_<ACCESS> yourself" }
        tagesgrenze: { titel: Sends per day, beschreibung: "At most this many mails per day (UTC) across all accesses; a safety belt against loops and mistakes" }
    bilder: [post-1.svg]
    art: plugin
    pflicht: false
    abhaengig_von: [kern, agent]
    voraussetzungen:
      - Ein laufender Listmonk (die Werkzeuge sind gegen die API der Version 6 gebaut) mit eingerichtetem SMTP-Weg und einer Absenderadresse; Listmonk liefert dieser Baustein nicht mit
      - Der Admin-Zugang von Listmonk für einen einmaligen Schritt, `fyos-post-einrichten --ja` (legt Vorlage, Rolle und API-Zugang an)
      - Das Paket kommt aus dem Paketindex (FYOS_PAKETINDEX) oder der Plugin-Quelle (FYOS_PLUGIN_QUELLE), nicht von PyPI
    quelle: { paket: fyos-plugin-mail, repo: fyos-plugin-mail }
    reife: { agent: 2, gedaechtnis: 1 }
    konfiguration:
      - name: url
        titel: Adresse von Listmonk
        typ: url
        beschreibung: Wo Listmonk für den Hub erreichbar ist, etwa http://listmonk:9000 (ohne Adresse ist FYOS Post nicht eingerichtet)
        standard: ""
        pflicht: false
        umgebung: FYOS_POST_URL
      - name: link
        titel: Adresse der Listmonk-Oberfläche
        typ: url
        beschreibung: Wo du Listmonk im Browser öffnest; damit zeigen die Antworten Links zu Kampagnen (leer = keine Links)
        standard: ""
        pflicht: false
        umgebung: FYOS_POST_LINK
      - name: an
        titel: Standardempfänger
        typ: text
        beschreibung: Die Adresse, an die Mitteilungen ohne Angabe gehen; sie muss in Listmonk Abonnent sein (leer = der Agent muss einen Empfänger nennen)
        standard: ""
        pflicht: false
        umgebung: FYOS_POST_AN
      - name: zugaenge
        titel: Zugänge
        typ: text
        beschreibung: "Welcher Listmonk-Benutzer für welche Fläche gilt, als Paare Fläche=Benutzer oder Fläche=Benutzer/Name; Flächen sind os, chat, code, agent, dienste, * steht für alle übrigen. Die Vorgabe *=fyos genügt meist."
        standard: "*=fyos"
        pflicht: false
        umgebung: FYOS_POST_ZUGAENGE
      - name: token_fyos
        titel: Token des Zugangs fyos
        typ: geheim
        beschreibung: Das Token des API-Benutzers fyos in Listmonk (legt `fyos-post-einrichten --ja --token-datei …` an); bei anderen Zugängen die Variable FYOS_POST_TOKEN_<ZUGANG> selbst setzen
        standard: ""
        pflicht: false
        umgebung: FYOS_POST_TOKEN_FYOS
      - name: tagesgrenze
        titel: Sendungen am Tag
        typ: zahl
        beschreibung: Höchstens so viele Mails am Tag (UTC) über alle Zugänge; ein Sicherheitsgurt gegen Schleifen und Versehen
        standard: 30
        pflicht: false
        umgebung: FYOS_POST_TAGESGRENZE

  - id: betrieb
    titel: Betrieb mit Cluster, Git und CI
    kurz: Cluster, Code-Hosting und Builds im Blick und per Agent bedienbar.
    was_daraus_wird: |
      Du bekommst ein Steuerpult für deinen Kubernetes-Cluster mit Knoten, Workloads, Logs und Update-Zustand.
      Dazu kommen Git-Repositories und Build-Läufe der CI, sodass du an einer Stelle siehst, was grün ist und was hängt.
      Der Agent liest Zustände und Logs selbst und schlägt bei Problemen einen Neustart oder einen Rückweg vor.
      Alles Schreibende läuft über die Freigabe, zum Beispiel ein Löschen oder ein Hochziehen von Versionen.
      Gedacht ist der Baustein für alle, die einen eigenen Server oder Cluster betreiben.
    en:
      titel: Operations with cluster, Git and CI
      kurz: Cluster, code hosting and builds at a glance and operable through the agent.
      was_daraus_wird: |
        You get a control panel for your Kubernetes cluster with nodes, workloads, logs and update state.
        Git repositories and CI build runs are added, so you see in one place what is green and what is stuck.
        The agent reads states and logs itself and suggests a restart or a rollback when there are problems.
        Everything that writes goes through approval, for example deleting or bumping versions.
        The building block is meant for everyone who runs their own server or cluster.
      voraussetzungen:
        - Access to a Kubernetes cluster via kubeconfig
        - Optionally a Git hosting (Gitea or GitLab) with an API token
      felder:
        kubeconfig_pfad: { titel: Path of the kubeconfig, beschreibung: Path of the kubeconfig in the Hub container (you mount the file itself later) }
        git_url: { titel: Address of the Git hosting, beschreibung: Address of your Git hosting }
        git_token: { titel: Git token, beschreibung: API token of the Git hosting }
    bilder: [betrieb-1.svg]
    art: plugin
    pflicht: false
    abhaengig_von: [kern, agent]
    voraussetzungen:
      - Zugriff per kubeconfig auf einen Kubernetes-Cluster
      - Optional ein Git-Hosting (Gitea oder GitLab) mit API-Token
    quelle: { paket: fyos-plugin-betrieb, repo: fyos-plugin-betrieb }
    reife: { oberflaeche: 2, agent: 2, gedaechtnis: 2 }
    konfiguration:
      - name: kubeconfig_pfad
        titel: Pfad der kubeconfig
        typ: text
        beschreibung: Pfad der kubeconfig im Hub-Container (die Datei selbst bindest du später ein)
        standard: /etc/fyos-hub/kubeconfig
        pflicht: false
        umgebung: FYOS_BETRIEB_KUBECONFIG
      - name: git_url
        titel: Adresse des Git-Hostings
        typ: url
        beschreibung: Adresse deines Git-Hostings
        standard: ""
        pflicht: false
        umgebung: FYOS_BETRIEB_GIT_URL
      - name: git_token
        titel: Git-Token
        typ: geheim
        beschreibung: API-Token des Git-Hostings
        standard: ""
        pflicht: false
        umgebung: FYOS_BETRIEB_GIT_TOKEN

  - id: eigenes_modell
    titel: Eigenes Sprachmodell und Messkette
    kurz: Ein selbst betriebenes Modell mit Rechnerübersicht und Messläufen.
    was_daraus_wird: |
      Statt eines gehosteten Dienstes betreibst du ein eigenes Sprachmodell auf eigener Hardware und siehst seinen Zustand in einer App.
      Eine Übersicht zeigt, welches Profil gerade läuft, wie schnell es antwortet und wie ausgelastet der Rechner ist.
      Die Messkette fährt Vergleichsläufe, sammelt die Ergebnisse und stellt Profile nebeneinander, bevor du eines umstellst.
      Der Agent erklärt den Zustand und schlägt Umstellungen vor, die du freigibst.
      Der Baustein ist für Fortgeschrittene gedacht, die Rechenzeit und Speicher gezielt einsetzen wollen.
    en:
      titel: Own language model and measurement chain
      kurz: A self-hosted model with a machine overview and measurement runs.
      was_daraus_wird: |
        Instead of a hosted service you run your own language model on your own hardware and see its state in an app.
        An overview shows which profile is running, how fast it answers and how busy the machine is.
        The measurement chain runs comparison runs, collects the results and puts profiles side by side before you switch one.
        The agent explains the state and suggests changes that you approve.
        The building block is meant for advanced users who want to use compute time and memory deliberately.
      voraussetzungen:
        - A machine of your own with a GPU and ssh access
        - A model server with an OpenAI-compatible interface
      felder:
        rechner_host: { titel: Model machine, beschreibung: Name of the machine the model runs on (ssh short name) }
        pult_url: { titel: Address of the control panel, beschreibung: Address of the model server's control panel }
    bilder: [eigenes_modell-1.svg]
    art: plugin
    pflicht: false
    abhaengig_von: [kern, agent]
    voraussetzungen:
      - Ein eigener Rechner mit GPU und ssh-Zugang
      - Ein Modellserver mit OpenAI-kompatibler Schnittstelle
    quelle: { paket: fyos-plugin-modell, repo: fyos-plugin-modell }
    reife: { oberflaeche: 2, agent: 2, gedaechtnis: 2 }
    konfiguration:
      - name: rechner_host
        titel: Rechner des Modells
        typ: text
        beschreibung: Name des Rechners, auf dem das Modell läuft (ssh-Kurzname)
        standard: ""
        pflicht: false
        umgebung: FYOS_MODELL_RECHNER
      - name: pult_url
        titel: Adresse des Steuerpults
        typ: url
        beschreibung: Adresse des Steuerpults des Modellservers
        standard: ""
        pflicht: false
        umgebung: FYOS_MODELL_PULT_URL

  - id: leitstand
    titel: Leitstand, Vorgänge und Agenten-Schleifen
    kurz: Eine Zentrale für Entscheidungen, Freigaben, Vorgänge und Routinearbeit des Agenten.
    was_daraus_wird: |
      Du bekommst eine Zentrale, die zeigt, was auf dich wartet: Entscheidungen, Freigaben und offene Vorgänge in einer Liste.
      Der Agent legt Vorgänge an, arbeitet sie ab und meldet den Stand, ohne dass du nachfragen musst.
      Freigaben beantwortest du mit einem Klick oder direkt im Chat.
      Agenten-Schleifen erledigen Routinearbeit in der Zeit, in der du nicht aktiv bist, und halten an, sobald du dich meldest.
      Ein Verlauf zeigt jederzeit, was getan wurde und warum.
    en:
      titel: Control room, tickets and agent loops
      kurz: A control center for decisions, approvals, tickets and the agent's routine work.
      was_daraus_wird: |
        You get a control center that shows what is waiting for you: decisions, approvals and open tickets in one list.
        The agent creates tickets, works through them and reports the state without you having to ask.
        You answer approvals with one click or directly in the chat.
        Agent loops do routine work while you are not active, and stop as soon as you return.
        A history shows at any time what was done and why.
      voraussetzungen:
        - No external services; without a ticket service the tickets live in a store in the Hub
        - For the document inbox a Paperless-ngx with a token (address below); without it the inbox honestly says »Documents not set up«
      felder:
        vorgaenge_url: { titel: Address of the ticket service, beschreibung: "Ticket service with the ticket contract (…/tickets); empty = the store in the Hub" }
        vorgaenge_kopf: { titel: Header for the ticket service, beschreibung: "A header »Name: Value« that every call to the ticket service sends, such as a sign-in" }
        dokumente_url: { titel: Paperless address, beschreibung: "Paperless-ngx for the document inbox, as the Hub reaches it (only the root, without /api); empty = documents are not set up" }
        dokumente_kopf: { titel: Token for Paperless, beschreibung: "A header »Name: Value« for Paperless, usually »Authorization: Token <token>« (Paperless: My profile, auth token)" }
        dokumente_link: { titel: Paperless address in the browser, beschreibung: Target of the links from the document inbox; empty = no links }
    bilder: [leitstand-1.svg]
    art: plugin
    pflicht: false
    abhaengig_von: [kern, agent]
    voraussetzungen:
      - Keine äußeren Dienste; ohne Ticketdienst liegen die Vorgänge in einer Ablage im Hub
      - Für den Dokumenten-Eingang ein Paperless-ngx mit einem Token (Adresse unten); ohne ihn sagt der Eingang ehrlich »Dokumente nicht eingerichtet«
    quelle: { paket: fyos-plugin-leitstand, repo: fyos-plugin-leitstand }
    reife: { oberflaeche: 3, agent: 3, gedaechtnis: 3, takte: 2 }
    konfiguration:
      - name: vorgaenge_url
        titel: Adresse des Ticketdienstes
        typ: url
        beschreibung: Ticketdienst mit dem Vorgangs-Vertrag (…/tickets); leer = die Ablage im Hub
        standard: ""
        pflicht: false
        umgebung: FYOS_VORGAENGE_URL
      - name: vorgaenge_kopf
        titel: Kopfzeile für den Ticketdienst
        typ: geheim
        beschreibung: "Eine Kopfzeile „Name: Wert“, die jeder Aufruf beim Ticketdienst mitschickt, etwa eine Anmeldung"
        standard: ""
        pflicht: false
        umgebung: FYOS_VORGAENGE_KOPF
      - name: dokumente_url
        titel: Adresse von Paperless
        typ: url
        beschreibung: "Paperless-ngx für den Dokumenten-Eingang, so wie der Hub es erreicht (nur die Wurzel, ohne /api); leer = Dokumente sind nicht eingerichtet"
        standard: ""
        pflicht: false
        umgebung: FYOS_DOKUMENTE_URL
      - name: dokumente_kopf
        titel: Token für Paperless
        typ: geheim
        beschreibung: "Eine Kopfzeile „Name: Wert“ für Paperless, meist „Authorization: Token <Token>“ (Paperless: Mein Profil, Auth-Token)"
        standard: ""
        pflicht: false
        umgebung: FYOS_DOKUMENTE_KOPF
      - name: dokumente_link
        titel: Adresse von Paperless im Browser
        typ: url
        beschreibung: Ziel der Links aus dem Dokumenten-Eingang; leer = keine Links
        standard: ""
        pflicht: false
        umgebung: FYOS_DOKUMENTE_LINK
