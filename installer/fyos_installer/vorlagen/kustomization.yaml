# Overlay for FYOS on Kubernetes, generated by the FYOS installer.
#   kubectl create namespace {{namespace}}
#   kubectl apply -f secrets.yaml
#   kubectl apply -k .
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: {{namespace}}
resources:
  - {{k8s_basis}}
# Without a name hash: after changing the ConfigMaps, restart with `kubectl rollout restart`.
generatorOptions:
  disableNameSuffixHash: true
configMapGenerator:
  - name: fyos-agent-config
    behavior: replace
    files:
      - agent-runner.json
  - name: fyos-hub-config
    behavior: replace
    files:
      - config.yaml=hub-config.yaml
  - name: fyos-umgebung
    behavior: replace
    literals:
{{umgebung_literale}}
  - name: fyos-plugin-umgebung
    literals:
{{plugin_literale}}
  # Runtime configuration of the interface (language: en or de), mounted as with Docker Compose
  - name: fyos-web-config
    files:
      - fyos.config.json
# The base already names its images with the example address; so exactly these names are replaced.
images:
  - name: {{web_basis}}
    newName: {{web_name}}
    newTag: {{web_tag}}
  - name: {{agent_basis}}
    newName: {{agent_name}}
    newTag: {{agent_tag}}
  - name: {{hub_basis}}
    newName: {{hub_bild_name}}
    newTag: {{hub_bild_tag}}
patches:
  - target: { kind: Deployment, name: hub }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/envFrom
        value:
          - configMapRef: { name: fyos-plugin-umgebung, optional: true }
          - secretRef: { name: fyos-plugin, optional: true }
  - target: { kind: Deployment, name: web }
    patch: |-
      - op: add
        path: /spec/template/spec/volumes
        value:
          - name: fyos-web-config
            configMap: { name: fyos-web-config }
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts
        value:
          - name: fyos-web-config
            mountPath: /etc/fyos/fyos.config.json
            subPath: fyos.config.json
            readOnly: true
