# FYOS on a single machine, generated by the FYOS installer.
# Start: docker compose build && docker compose up -d   Then open {{oeffentliche_url}}.
# Values in .env (template of the distribution: deploy/compose/env.example).
services:
  web:
    image: ${FYOS_BILD_WEB:?FYOS_BILD_WEB is missing in .env}
    ports:
      - "${FYOS_PORT:-8080}:8080"
    environment:
      FYOS_HUB_UPSTREAM: http://hub:8080
      FYOS_AGENT_UPSTREAM: http://agent:18438
      # Sign-in of the interface with the runner (nginx sets the header for /api/agent/)
      FYOS_AGENT_TOKEN: ${FYOS_AGENT_TOKEN}
    volumes:
      # Runtime configuration of the interface (language: en or de)
      - ./fyos.config.json:/etc/fyos/fyos.config.json:ro
    depends_on: [hub, agent]
    restart: unless-stopped

  hub:
    # Own image: the distribution's Hub plus the chosen plugin packages (hub/Dockerfile).
    build:
      context: ./hub
      args:
        FYOS_INDEX_URL: ${FYOS_PAKETINDEX:-}
    image: ${FYOS_BILD_HUB_EIGEN:-fyos-hub-eigen:lokal}
    environment:
      MCP_HUB_CONFIG_PATH: /etc/fyos-hub/config.yaml
      REDIS_URL: redis://redis:6379/0
      FYOS_OEFFENTLICH_URL: ${FYOS_OEFFENTLICH_URL:-http://localhost:8080}
      # Time zone of the Hub: daily counters and time windows of the schedules, e.g. TZ=Europe/Berlin in .env
      TZ: ${TZ:-UTC}
      # File store (plugin dateien, app "Files"): folder in the volume, largest file in MB
      FYOS_DATEIEN: /data/dateien
      FYOS_DATEIEN_MAX_MB: ${FYOS_DATEIEN_MAX_MB:-25}
{{hub_umgebung}}
    volumes:
      - ./hub-config.yaml:/etc/fyos-hub/config.yaml:ro
      - dateien:/data/dateien
    depends_on: [redis]
    restart: unless-stopped

{{agent_dienst}}

  redis:
    image: redis:7.4-alpine
    command: ["--save", "", "--appendonly", "no"]
    restart: unless-stopped

volumes:
  agent-zustand:
  # The file store; a host folder instead of the volume: `/path/to/store:/data/dateien` (owner: uid 1000)
  dateien:
