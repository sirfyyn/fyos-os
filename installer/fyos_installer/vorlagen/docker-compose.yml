# FYOS als Einzelplatz, erzeugt vom FYOS-Installer.
# Starten: docker compose build && docker compose up -d   Danach {{oeffentliche_url}} öffnen.
# Werte in .env (Vorlage der Distribution: deploy/compose/env.example).
services:
  web:
    image: ${FYOS_BILD_WEB:?FYOS_BILD_WEB fehlt in .env}
    ports:
      - "${FYOS_PORT:-8080}:8080"
    environment:
      FYOS_HUB_UPSTREAM: http://hub:8080
      FYOS_AGENT_UPSTREAM: http://agent:18438
      # Anmeldung der Oberfläche beim Runner (nginx setzt den Kopf für /api/agent/)
      FYOS_AGENT_TOKEN: ${FYOS_AGENT_TOKEN}
    depends_on: [hub, agent]
    restart: unless-stopped

  hub:
    # Eigenes Bild: Hub der Distribution plus die gewählten Plugin-Pakete (hub/Dockerfile).
    build:
      context: ./hub
      args:
        FYOS_INDEX_URL: ${FYOS_PAKETINDEX:-}
    image: ${FYOS_BILD_HUB_EIGEN:-fyos-hub-eigen:lokal}
    environment:
      MCP_HUB_CONFIG_PATH: /etc/fyos-hub/config.yaml
      REDIS_URL: redis://redis:6379/0
      FYOS_OEFFENTLICH_URL: ${FYOS_OEFFENTLICH_URL:-http://localhost:8080}
      # Zeitzone des Hubs: Tageszähler und Zeitfenster der Takte, z. B. TZ=Europe/Berlin in .env
      TZ: ${TZ:-UTC}
      # Dateiablage (Plugin dateien, App „Dateien“): Ordner im Volume, größte Datei in MB
      FYOS_DATEIEN: /data/dateien
      FYOS_DATEIEN_MAX_MB: ${FYOS_DATEIEN_MAX_MB:-25}
{{hub_umgebung}}
    volumes:
      - ./hub-config.yaml:/etc/fyos-hub/config.yaml:ro
      - dateien:/data/dateien
    depends_on: [redis]
    restart: unless-stopped

{{agent_dienst}}

  redis:
    image: redis:7.4-alpine
    command: ["--save", "", "--appendonly", "no"]
    restart: unless-stopped

volumes:
  agent-zustand:
  # Die Dateiablage; Ordner des Hosts statt Volume: `/pfad/zur/ablage:/data/dateien` (Besitzer: uid 1000)
  dateien:
