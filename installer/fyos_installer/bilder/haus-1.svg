<circle class="wrm" cx="320" cy="100" r="13"/>
<circle class="bar" cx="110" cy="250" r="13"/><circle class="ln" cx="110" cy="250" r="13"/>
<circle class="bar" cx="330" cy="250" r="13"/><circle class="ln" cx="330" cy="250" r="13"/>
<circle class="acc" cx="170" cy="270" r="9"/><circle class="ln" cx="170" cy="270" r="15" opacity=".4"/>
<text class="mut" x="190" y="275">du bist hier</text>
<rect class="fl" x="470" y="30" width="150" height="290" rx="10"/>
