<circle class="acc" cx="112" cy="40" r="7"/>
<text class="ink" x="128" y="45" font-weight="700">Matrix · Direktnachricht mit Fy</text>
<rect class="fl" x="110" y="74" width="250" height="40" rx="14"/>
