<text class="ink" x="124" y="99">Das Backup ist fertig.</text>
<rect class="fl" x="110" y="128" width="420" height="104" rx="12"/>
<rect class="ln" x="110" y="128" width="420" height="104" rx="12"/>
<rect class="wrm" x="110" y="128" width="8" height="104" rx="4"/>
<text class="ink" x="132" y="154" font-weight="700">Freigabe nötig: Löschen</text>
<text class="mut" x="132" y="178">Alte Sicherungen in den Papierkorb legen?</text>
<rect class="acc" x="132" y="192" width="110" height="28" rx="14"/>
