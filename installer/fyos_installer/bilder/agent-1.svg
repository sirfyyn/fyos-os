<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t d">
<title id="t">Skizze: Chatfenster mit Freigabe-Karte</title>
<desc id="d">Ein Chatfenster mit einer Frage von Alex, der Antwort von Fy und einer Freigabe-Karte mit den Knöpfen Freigeben und Ablehnen.</desc>
<style>
.bg{fill:#f4f1ea}.fl{fill:#fffdf8}.bar{fill:#e6e0d3}.ink{fill:#2b2a27}.mut{fill:#8b8578}.acc{fill:#3f7d6e}.wrm{fill:#c9824a}
.ln{fill:none;stroke:#2b2a27;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.dsh{stroke-dasharray:6 5;opacity:.45}
text{font-family:ui-rounded,system-ui,-apple-system,sans-serif;font-size:14px}
@media (prefers-color-scheme:dark){.bg{fill:#1d1c1a}.fl{fill:#2a2926}.bar{fill:#3a3833}.ink{fill:#ece7dc}.mut{fill:#8f897c}.acc{fill:#5fb3a0}.wrm{fill:#e0a06b}.ln{stroke:#ece7dc}}
</style>
<rect class="bg" width="640" height="400" rx="14"/>
<rect class="ln dsh" x="6" y="6" width="628" height="388" rx="10"/>
<rect class="fl" x="90" y="24" width="460" height="352" rx="12"/>
<rect class="ln" x="90" y="24" width="460" height="352" rx="12"/>
<rect class="bar" x="91" y="25" width="458" height="30" rx="11"/>
<circle class="acc" cx="112" cy="40" r="7"/>
<text class="ink" x="128" y="45" font-weight="700">Fy</text>
<rect class="bar" x="290" y="72" width="240" height="40" rx="14"/>
<text class="ink" x="304" y="97">Räum bitte den Ordner Downloads auf.</text>
<text class="mut" x="500" y="128" font-size="11">Alex</text>
<rect class="fl" x="110" y="138" width="260" height="40" rx="14"/>
<rect class="ln" x="110" y="138" width="260" height="40" rx="14"/>
<text class="ink" x="124" y="163">Ich habe 14 Dateien gefunden.</text>
<rect class="fl" x="110" y="196" width="420" height="116" rx="12"/>
<rect class="ln" x="110" y="196" width="420" height="116" rx="12"/>
<rect class="wrm" x="110" y="196" width="8" height="116" rx="4"/>
<text class="ink" x="132" y="222" font-weight="700">Freigabe nötig: Löschen</text>
<text class="mut" x="132" y="246">14 Dateien (212 MB) in den Papierkorb legen?</text>
<rect class="acc" x="132" y="266" width="120" height="30" rx="15"/>
<text class="fl" x="156" y="286" font-weight="700">Freigeben</text>
<rect class="ln" x="266" y="266" width="120" height="30" rx="15"/>
<text class="ink" x="292" y="286">Ablehnen</text>
<rect class="bar" x="110" y="332" width="380" height="30" rx="15"/>
<text class="mut" x="128" y="352">Nachricht an Fy …</text>
<circle class="acc" cx="510" cy="347" r="14"/>
<path class="fl" d="M504 347h12M511 341l6 6-6 6" fill="none" stroke="#fffdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
<text class="mut" x="566" y="388" font-size="12">Skizze</text>
</svg>
