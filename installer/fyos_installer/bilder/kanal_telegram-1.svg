<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t d">
<title id="t">Skizze: Telegram-Chat mit dem Agenten auf dem Telefon</title>
<desc id="d">Ein Telefon zeigt einen Telegram-Chat: Die Meldung des Agenten über eine fertige Aufgabe und eine Freigabe-Frage mit den Antworten Ja und Nein, daneben das FYOS-Fenster mit demselben Gespräch.</desc>
