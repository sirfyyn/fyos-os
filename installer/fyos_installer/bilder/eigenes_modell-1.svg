<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t d">
<title id="t">Skizze: Modellzustand und Messkette</title>
<desc id="d">Ein Fenster mit dem laufenden Modellprofil, Auslastungsanzeigen für Rechner und Speicher sowie einem Balkendiagramm, das drei Profile in einer Messreihe vergleicht.</desc>
<style>
.bg{fill:#f4f1ea}.fl{fill:#fffdf8}.bar{fill:#e6e0d3}.ink{fill:#2b2a27}.mut{fill:#8b8578}.acc{fill:#3f7d6e}.wrm{fill:#c9824a}
.ln{fill:none;stroke:#2b2a27;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.dsh{stroke-dasharray:6 5;opacity:.45}
text{font-family:ui-rounded,system-ui,-apple-system,sans-serif;font-size:14px}
@media (prefers-color-scheme:dark){.bg{fill:#1d1c1a}.fl{fill:#2a2926}.bar{fill:#3a3833}.ink{fill:#ece7dc}.mut{fill:#8f897c}.acc{fill:#5fb3a0}.wrm{fill:#e0a06b}.ln{stroke:#ece7dc}}
</style>
<rect class="bg" width="640" height="400" rx="14"/>
<rect class="ln dsh" x="6" y="6" width="628" height="388" rx="10"/>
<rect class="fl" x="40" y="26" width="560" height="348" rx="12"/>
<rect class="ln" x="40" y="26" width="560" height="348" rx="12"/>
<rect class="bar" x="41" y="27" width="558" height="28" rx="11"/>
<text class="ink" x="250" y="46">Eigenes Modell</text>
<rect class="acc" x="60" y="72" width="250" height="64" rx="10"/>
<text class="fl" x="78" y="98" font-weight="700">Profil läuft: Profil-B</text>
<text class="fl" x="78" y="122">Antwortet in Echtzeit</text>
<text class="ink" x="340" y="88">Rechner</text><rect class="bar" x="410" y="77" width="170" height="12" rx="6"/><rect class="acc" x="410" y="77" width="104" height="12" rx="6"/>
<text class="ink" x="340" y="112">Speicher</text><rect class="bar" x="410" y="101" width="170" height="12" rx="6"/><rect class="wrm" x="410" y="101" width="142" height="12" rx="6"/>
<text class="ink" x="340" y="136">Wärme</text><rect class="bar" x="410" y="125" width="170" height="12" rx="6"/><rect class="acc" x="410" y="125" width="70" height="12" rx="6"/>
<text class="ink" x="60" y="178" font-weight="700">Messreihe: Tempo je Profil</text>
<path class="ln" d="M70 190v140h350" opacity=".45"/>
<rect class="mut" x="100" y="270" width="52" height="60" rx="4"/><text class="mut" x="102" y="350">Profil-A</text>
<rect class="acc" x="200" y="226" width="52" height="104" rx="4"/><text class="mut" x="202" y="350">Profil-B</text>
<rect class="wrm" x="300" y="246" width="52" height="84" rx="4"/><text class="mut" x="302" y="350">Profil-C</text>
<rect class="bar" x="450" y="190" width="130" height="140" rx="10"/>
<text class="ink" x="466" y="216" font-weight="700">Fy schlägt vor:</text>
<text class="mut" x="466" y="242">Profil-B behalten,</text>
<text class="mut" x="466" y="262">Profil-C testen.</text>
<rect class="ln" x="466" y="284" width="98" height="28" rx="14"/><text class="ink" x="486" y="303">Freigeben</text>
<text class="mut" x="566" y="388" font-size="12">Skizze</text>
</svg>
