<rect class="fl" x="158" y="108" width="24" height="24" rx="2"/><rect class="ink" x="164" y="114" width="12" height="12"/>
<rect class="fl" x="108" y="158" width="24" height="24" rx="2"/><rect class="ink" x="114" y="164" width="12" height="12"/>
<rect class="fl" x="142" y="142" width="10" height="10"/><rect class="fl" x="160" y="160" width="10" height="10"/><rect class="fl" x="142" y="172" width="10" height="10"/>
<text class="mut" x="60" y="222" font-size="12">openclaw channels login</text>
<text class="mut" x="60" y="242" font-size="12">QR mit dem Telefon einlesen</text>
<text class="mut" x="60" y="262" font-size="12">(das machst du selbst)</text>
<text class="ink" x="360" y="44" font-weight="700">2. Danach im Chat</text>
<rect class="fl" x="360" y="60" width="230" height="300" rx="26"/>
<rect class="ln" x="360" y="60" width="230" height="300" rx="26"/>
<rect class="bar" x="380" y="78" width="190" height="26" rx="13"/>
<circle class="acc" cx="396" cy="91" r="7"/>
