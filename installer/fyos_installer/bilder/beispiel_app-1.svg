<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t d">
<title id="t">Skizze: Beispiel-App</title>
<desc id="d">Ein kleines Fenster mit einer Eingabe, einem Knopf und einer Antwortzeile; daneben ein Baukasten-Hinweis, dass Plugins eigene Oberflächen liefern.</desc>
