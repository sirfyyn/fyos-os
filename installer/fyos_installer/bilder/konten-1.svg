<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t d">
<title id="t">Skizze: Konten, Mail und Kalender</title>
<desc id="d">Ein Konten-Überblick mit Kacheln für Mail, Kalender, Fotos, Medien und Bestellungen, jeweils mit grünem oder orangem Zustandspunkt, und einer Terminliste für heute.</desc>
<style>
.bg{fill:#f4f1ea}.fl{fill:#fffdf8}.bar{fill:#e6e0d3}.ink{fill:#2b2a27}.mut{fill:#8b8578}.acc{fill:#3f7d6e}.wrm{fill:#c9824a}
.ln{fill:none;stroke:#2b2a27;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}.dsh{stroke-dasharray:6 5;opacity:.45}
text{font-family:ui-rounded,system-ui,-apple-system,sans-serif;font-size:14px}
@media (prefers-color-scheme:dark){.bg{fill:#1d1c1a}.fl{fill:#2a2926}.bar{fill:#3a3833}.ink{fill:#ece7dc}.mut{fill:#8f897c}.acc{fill:#5fb3a0}.wrm{fill:#e0a06b}.ln{stroke:#ece7dc}}
</style>
<rect class="bg" width="640" height="400" rx="14"/>
<rect class="ln dsh" x="6" y="6" width="628" height="388" rx="10"/>
<rect class="fl" x="40" y="26" width="560" height="348" rx="12"/>
<rect class="ln" x="40" y="26" width="560" height="348" rx="12"/>
<rect class="bar" x="41" y="27" width="558" height="28" rx="11"/>
<text class="ink" x="278" y="46">Konten und Medien</text>
<rect class="bar" x="60" y="72" width="164" height="70" rx="8"/><circle class="acc" cx="206" cy="88" r="6"/>
<text class="ink" x="76" y="100" font-weight="700">Mail</text><text class="mut" x="76" y="124">4 ungelesen</text>
<rect class="bar" x="238" y="72" width="164" height="70" rx="8"/><circle class="acc" cx="384" cy="88" r="6"/>
<text class="ink" x="254" y="100" font-weight="700">Kalender</text><text class="mut" x="254" y="124">2 Termine heute</text>
<rect class="bar" x="416" y="72" width="164" height="70" rx="8"/><circle class="wrm" cx="562" cy="88" r="6"/>
<text class="ink" x="432" y="100" font-weight="700">Fotos</text><text class="mut" x="432" y="124">Anmeldung erneuern</text>
<rect class="bar" x="60" y="154" width="164" height="70" rx="8"/><circle class="acc" cx="206" cy="170" r="6"/>
<text class="ink" x="76" y="182" font-weight="700">Medien</text><text class="mut" x="76" y="206">Bibliothek bereit</text>
<rect class="bar" x="238" y="154" width="164" height="70" rx="8"/><circle class="acc" cx="384" cy="170" r="6"/>
<text class="ink" x="254" y="182" font-weight="700">Bestellungen</text><text class="mut" x="254" y="206">1 unterwegs</text>
<rect class="bar" x="416" y="154" width="164" height="70" rx="8"/><circle class="acc" cx="562" cy="170" r="6"/>
<text class="ink" x="432" y="182" font-weight="700">Tresor</text><text class="mut" x="432" y="206">entsperrt</text>
<text class="ink" x="60" y="256" font-weight="700">Heute</text>
<path class="ln" d="M60 266h520" opacity=".3"/>
<text class="mut" x="60" y="290">10:00</text><text class="ink" x="120" y="290">Zahnarzt</text>
<text class="mut" x="60" y="318">15:30</text><text class="ink" x="120" y="318">Telefonat mit Sam</text>
<text class="mut" x="60" y="346">18:00</text><text class="ink" x="120" y="346">Einkauf abholen</text>
<text class="mut" x="566" y="388" font-size="12">Skizze</text>
