<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" aria-labelledby="t d">
<title id="t">Skizze: Monatsansicht mit den Terminen des Tages</title>
<desc id="d">Ein Monatsraster mit markiertem heutigem Tag und Punkten an Tagen mit Terminen, daneben eine Liste für heute mit einem ganztägigen Termin und zwei Terminen mit Uhrzeit sowie ein Hinweis auf die Quelle (CalDAV oder ICS-Abo).</desc>
