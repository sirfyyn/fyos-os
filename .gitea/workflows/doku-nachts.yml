# Full docs check: every night and on demand (Gitea: Actions, doku-nachts, "Run workflow").
# tools/doku_pruefen.py checks all Markdown files against the file tree: dead links and anchors, named paths,
# fixed sections of the READMEs. What the docs name but is not in this repo is listed with a reason in .doku/ausserhalb.txt.
# Repo variable: FYOS_RUNNER (CI runner label), as in ci.yml. The time is the Git server's.
name: doku-nachts

on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

jobs:
  doku:
    runs-on: ${{ vars.FYOS_RUNNER }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Check the docs against the file tree
        run: python3 tools/doku_pruefen.py
