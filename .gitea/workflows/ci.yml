# Check on every pull request and on main, build images on main.
# Repo variables: FYOS_RUNNER (CI runner label), FYOS_REGISTRY (e.g. registry.example.com/org),
# optionally FYOS_REGISTRY_HOSTS (add-hosts for buildx, e.g. "registry.example.com=192.0.2.10").
# Login to registry and package index: secrets REGISTRY_USER/REGISTRY_TOKEN (token with write:package; Gitea gives the
# runtime token GITEA_TOKEN no package permissions). If they are missing, the run tries the runtime token (packages: write).
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Tested continuously: daily against the newest packages from the
  # index, even without a commit. A red run is reported as a ticket (area dist).
  schedule:
    - cron: "7 5 * * *"

# Exactly one run per commit: the PR run checks branches, the push run checks main. If push and PR runs of the same
# commit ran at the same time, they collided in the same work folder of the CI runner (`npm ci`, esbuild ETXTBSY,
# run #34); in a shared group Gitea cancelled the still waiting push run (run #35), and cancelled jobs count as
# failures in the commit status.
concurrency:
  group: ${{ gitea.workflow }}-${{ gitea.ref }}
  cancel-in-progress: false

jobs:
  pruefen:
    runs-on: ${{ vars.FYOS_RUNNER }}
    steps:
      - uses: actions/checkout@v4
      - name: Cleanliness
        run: python3 tools/sauber.py .
      - name: Hub tests
        run: |
          python3 -m venv /tmp/venv
          /tmp/venv/bin/pip install -q -e "hub[test]"
          /tmp/venv/bin/python -m pytest hub/tests -q
      - name: Tool tests
        run: /tmp/venv/bin/python -m pytest tools -q
      - name: Installer tests
        run: |
          /tmp/venv/bin/pip install -q -e "installer[test]"
          /tmp/venv/bin/python -m pytest installer/tests -q
      - name: Shell tests and build
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npx vitest run
          npx astro build

  paket:
    # fyos-hub as a Python package into the package registry (the Git server's PyPI API), so that plugin repos
    # can pull it with `uv pip install --index <index> fyos-hub` from the same index (docs/EXTENDING.md, section 9.4).
    # Version: <pyproject version>.dev<run number>.
    needs: pruefen
    if: gitea.ref == 'refs/heads/main' && gitea.event_name == 'push'
    runs-on: ${{ vars.FYOS_RUNNER }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      # setuptools 77 and newer takes LICENSE* and NOTICE* from the package's folder into wheel and sdist. The files live in
      # the repo root, so they are copied to hub/ before the build (pypi.yml under .github/workflows does the same).
      - name: Copy LICENSE and NOTICE into the package
        run: cp LICENSE NOTICE hub/
      - name: Build and upload
        working-directory: hub
        run: |
          python3 -m venv /tmp/paket
          /tmp/paket/bin/pip install -q build twine
          basis="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          sed -i "s/^version = \".*\"/version = \"${basis}.dev${{ gitea.run_number }}\"/" pyproject.toml
          /tmp/paket/bin/python -m build --wheel --sdist
          host="${FYOS_REGISTRY%%/*}"; besitzer="${FYOS_REGISTRY#*/}"
          /tmp/paket/bin/twine upload --non-interactive \
            --repository-url "https://${host}/api/packages/${besitzer}/pypi" \
            -u "$REGISTRY_USER" -p "$REGISTRY_TOKEN" dist/*
        env:
          FYOS_REGISTRY: ${{ vars.FYOS_REGISTRY }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER || gitea.actor }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GITEA_TOKEN }}

  bauen:
    needs: pruefen
    if: gitea.ref == 'refs/heads/main' && gitea.event_name == 'push'
    runs-on: ${{ vars.FYOS_RUNNER }}
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        teil: [web, hub]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host
      - name: Log in
        run: |
          host="${FYOS_REGISTRY%%/*}"
          printf '%s' "$REGISTRY_TOKEN" | docker login "$host" -u "$REGISTRY_USER" --password-stdin
        env:
          FYOS_REGISTRY: ${{ vars.FYOS_REGISTRY }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER || gitea.actor }}
          REGISTRY_TOKEN: ${{ secrets.REGISTRY_TOKEN || secrets.GITEA_TOKEN }}
      - uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.teil }}
          file: ${{ matrix.teil }}/Dockerfile
          add-hosts: ${{ vars.FYOS_REGISTRY_HOSTS }}
          push: true
          provenance: false
          sbom: false
          tags: |
            ${{ vars.FYOS_REGISTRY }}/fyos-os/${{ matrix.teil }}:main
            ${{ vars.FYOS_REGISTRY }}/fyos-os/${{ matrix.teil }}:${{ gitea.sha }}
